<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конус · 3D-модель</title>
<style>
  :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17263b; background: #f6f8fb; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px 24px; }
  main { width: min(100%, 1080px); margin: auto; }
  header { display: flex; justify-content: space-between; gap: 20px; align-items: center; margin-bottom: 22px; }
  h1 { margin: 0 0 6px; font-size: clamp(24px, 4vw, 32px); letter-spacing: -.9px; font-weight: 650; }
  .subtle { color: #748198; font-size: 13px; line-height: 1.5; margin: 0; }
  .badge { flex-shrink: 0; color: #0574f8; background: #e8f2fe; border-radius: 99px; padding: 9px 14px; font-size: 12px; font-weight: 650; letter-spacing: .06em; }
  .stage { position: relative; height: clamp(440px, 68vh, 720px); border-radius: 26px; overflow: hidden; background: #edf2f8; border: 1px solid #e4eaf2; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; outline: none; }
  canvas:active { cursor: grabbing; }
  canvas:focus-visible { outline: 3px solid #87b8fa; outline-offset: -4px; }
  .message { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; padding: 30px; text-align: center; background: #edf2f8; }
  .message[hidden], [hidden] { display: none !important; }
  .message strong { font-weight: 600; font-size: 17px; }
  .message p { max-width: 540px; margin: 0; line-height: 1.6; font-size: 14px; color: #64738b; overflow-wrap: anywhere; }
  .controls { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-top: 18px; }
  .group { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
  button, .download { min-height: 42px; border: 0; border-radius: 11px; padding: 10px 14px; background: #e9eef5; color: #344861; font: inherit; font-size: 13px; cursor: pointer; text-decoration: none; }
  button:hover, .download:hover { background: #e0e8f3; }
  button[aria-pressed="true"] { color: white; background: #0574f8; }
  button:focus-visible, .download:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid #87b8fa; outline-offset: 3px; }
  button:disabled { opacity: .45; cursor: default; }
  .swatch { display: inline-block; vertical-align: -1px; width: 11px; height: 11px; margin-right: 6px; border-radius: 50%; border: 1px solid #6f839b55; }
  footer { margin-top: 20px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
  #stats { font-size: 12px; color: #7b879a; }
  details { padding: 16px 0 0; margin-top: 18px; border-top: 1px solid #e1e7f0; }
  summary { cursor: pointer; font-size: 14px; color: #445873; width: fit-content; }
  .morph-grid { display: flex; gap: 20px; flex-wrap: wrap; align-items: end; margin-top: 18px; }
  .morph { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; width: min(210px, 100%); font-size: 12px; color: #64738b; }
  .morph input { grid-column: 1 / 3; width: 100%; accent-color: #0574f8; margin: 0; }
  @media (max-width: 600px) { body { padding: 22px 14px; } header { align-items: start; } .badge { padding: 8px 10px; } .stage { height: 540px; max-height: 72vh; min-height: 380px; border-radius: 20px; } .controls { gap: 12px; } button { padding: 10px 12px; } }
</style>
<main>
  <header>
    <div><h1>Конус в объёме</h1><p class="subtle">Рассмотрите маскота со всех сторон</p></div>
    <span class="badge">3D · GLB</span>
  </header>
  <div class="stage" id="stage">
    <div class="message" id="message" role="status" aria-live="polite">
      <strong id="message-title">Открываем 3D-модель</strong>
      <p id="message-detail">Загружаем геометрию и материалы…</p>
      <button id="retry" type="button" hidden>Повторить</button>
    </div>
  </div>
  <div class="controls">
    <div class="group" role="group" aria-label="Ракурс модели">
      <button type="button" data-view="front" disabled>Спереди</button>
      <button type="button" data-view="side" disabled>Сбоку</button>
      <button type="button" data-view="back" disabled>Сзади</button>
      <button type="button" data-view="reset" aria-pressed="true" disabled>Сбросить вид</button>
    </div>
    <div class="group" role="group" aria-label="Фон и геометрия">
      <button type="button" data-theme="light" aria-pressed="true"><span class="swatch" style="background:#edf2f8"></span>Светлый</button>
      <button type="button" data-theme="dark" aria-pressed="false"><span class="swatch" style="background:#141b28"></span>Тёмный</button>
      <button type="button" data-theme="blue" aria-pressed="false"><span class="swatch" style="background:#0574f8"></span>Синий</button>
      <button type="button" id="wireframe" aria-pressed="false" disabled>Сетка</button>
      <button type="button" id="skeleton" aria-pressed="false" hidden>Скелет</button>
    </div>
  </div>
  <details id="face-controls" hidden>
    <summary>Проверить мимику</summary>
    <div class="morph-grid" id="morph-controls"></div>
  </details>
  <footer>
    <p class="subtle">Вращайте мышью или пальцем · колесо или два пальца — масштаб</p>
    <span id="stats" aria-live="polite"></span>
    <a class="download" id="download" href="/model.glb" download="cone-mascot.glb" hidden>Скачать GLB</a>
  </footer>
</main>
<script src="/vendor/three.min.js"></script>
<script src="/vendor/GLTFLoader.js"></script>
<script src="/vendor/OrbitControls.js"></script>
<script src="/vendor/RoomEnvironment.js"></script>
<script>
(() => {
  'use strict';
  const stage = document.getElementById('stage');
  const message = document.getElementById('message');
  const title = document.getElementById('message-title');
  const detail = document.getElementById('message-detail');
  const retry = document.getElementById('retry');
  const api = window.mascotScene = { ready: false, loading: false, error: null, view: 'reset', theme: 'light', wireframe: false, stats: null, frames: 0 };
  function fail(error, reload = false) {
    api.loading = false;
    api.ready = false;
    api.error = error instanceof Error ? error.message : String(error);
    title.textContent = 'Не удалось открыть 3D-модель';
    detail.textContent = api.error;
    message.hidden = false;
    retry.hidden = false;
    retry.onclick = reload ? () => window.location.reload() : loadModel;
    console.error('Mascot viewer:', error);
  }
  if (!window.THREE || !THREE.GLTFLoader || !THREE.OrbitControls || !THREE.RoomEnvironment) {
    fail(new Error('Не найдены локальные библиотеки просмотра. Откройте страницу через tools/mascot/serve_model.py.'), true);
    return;
  }

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  } catch (error) {
    fail(new Error('Браузер не смог включить WebGL для 3D. ' + error.message), true);
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = .85;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.domElement.tabIndex = 0;
  renderer.domElement.setAttribute('aria-label', '3D-модель маскота. Вращение мышью или пальцем.');
  stage.prepend(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xedf2f8);
  const camera = new THREE.PerspectiveCamera(32, 1, .01, 100);
  camera.position.set(4, 3, 6);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.autoRotate = false;
  controls.enableDamping = false;
  controls.minPolarAngle = .08;
  controls.maxPolarAngle = Math.PI - .08;
  controls.rotateSpeed = .7;
  controls.zoomSpeed = .85;
  controls.target.set(0, 1.4, 0);
  controls.update();
  Object.assign(api, { scene, camera, renderer, controls, model: null });

  const room = new THREE.RoomEnvironment();
  const pmrem = new THREE.PMREMGenerator(renderer);
  const environment = pmrem.fromScene(room, .04);
  scene.environment = environment.texture;
  pmrem.dispose();
  room.traverse(node => {
    if (node.geometry) node.geometry.dispose();
    for (const material of [].concat(node.material || [])) material.dispose();
  });
  scene.add(new THREE.HemisphereLight(0xffffff, 0xa4b0c6, .3));
  const key = new THREE.DirectionalLight(0xfff4e8, 1);
  key.position.set(-3, 6, 4);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.left = key.shadow.camera.bottom = -4;
  key.shadow.camera.right = key.shadow.camera.top = 4;
  key.shadow.camera.near = .5;
  key.shadow.camera.far = 15;
  key.shadow.bias = -.00015;
  key.shadow.normalBias = .012;
  key.shadow.radius = 4;
  scene.add(key, key.target);
  const fill = new THREE.DirectionalLight(0xe4f0ff, .25);
  fill.position.set(4, 3, 2);
  scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffffff, .55);
  rim.position.set(2, 4, -4);
  scene.add(rim);
  const shadowMaterial = new THREE.ShadowMaterial({ color: 0x172c4c, opacity: .2 });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), shadowMaterial);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);
  const focus = new THREE.Vector3(0, 1.4, 0);
  let fitDistance = 7;
  let modelBounds = null;
  let skeletonHelper = null;
  const materials = new Set();
  const morphTargets = new Map();

  function render() {
    if (document.hidden) return;
    renderer.render(scene, camera);
    api.frames += 1;
  }
  api.render = render;
  function resize() {
    const width = stage.clientWidth;
    const height = stage.clientHeight;
    if (!width || !height) return;
    renderer.setSize(width, height, false);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    if (modelBounds) {
      const previousFit = fitDistance;
      fitCameraDistance();
      camera.position.sub(controls.target).multiplyScalar(fitDistance / previousFit).add(controls.target);
      controls.update();
    }
    render();
  }
  function fitCameraDistance() {
    const size = modelBounds.getSize(new THREE.Vector3());
    const radius = size.length() / 2;
    const halfVertical = THREE.MathUtils.degToRad(camera.fov) / 2;
    const halfHorizontal = Math.atan(Math.tan(halfVertical) * camera.aspect);
    fitDistance = radius / Math.sin(Math.min(halfVertical, halfHorizontal)) * 1.08;
    controls.minDistance = radius * 1.15;
    controls.maxDistance = fitDistance * 3;
    camera.near = Math.max(.005, radius / 100);
    camera.far = Math.max(100, fitDistance * 8);
    camera.updateProjectionMatrix();
  }
  function setView(view) {
    controls.target.copy(focus);
    const direction = {
      front: new THREE.Vector3(0, .08, 1),
      side: new THREE.Vector3(1, .08, 0),
      back: new THREE.Vector3(0, .08, -1),
      reset: new THREE.Vector3(.36, .19, 1),
    }[view];
    if (!direction) return;
    camera.position.copy(focus).add(direction.normalize().multiplyScalar(fitDistance));
    controls.update();
    api.view = view;
    document.querySelectorAll('[data-view]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === view)));
    render();
  }
  api.setView = setView;
  function setTheme(theme) {
    const backgrounds = { light: 0xedf2f8, dark: 0x141b28, blue: 0x0574f8 };
    if (!(theme in backgrounds)) return;
    scene.background.setHex(backgrounds[theme]);
    shadowMaterial.opacity = theme === 'dark' ? .38 : .2;
    api.theme = theme;
    document.querySelectorAll('[data-theme]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.theme === theme)));
    render();
  }
  api.setTheme = setTheme;
  function setWireframe(enabled) {
    api.wireframe = Boolean(enabled);
    for (const material of materials) {
      material.wireframe = api.wireframe;
      material.needsUpdate = true;
    }
    document.getElementById('wireframe').setAttribute('aria-pressed', String(api.wireframe));
    render();
  }
  api.setWireframe = setWireframe;
  function setMorph(name, value) {
    const targets = morphTargets.get(name);
    if (!targets) return false;
    const clamped = THREE.MathUtils.clamp(Number(value), 0, 1);
    if (!Number.isFinite(clamped)) return false;
    for (const target of targets) target.mesh.morphTargetInfluences[target.index] = clamped;
    const input = document.querySelector('[data-morph="' + CSS.escape(name) + '"]');
    if (input) {
      input.value = clamped;
      input.previousElementSibling.textContent = Math.round(clamped * 100) + '%';
    }
    render();
    return true;
  }
  api.setMorph = setMorph;
  function addMorphControls() {
    const labels = { BlinkLeft: 'Левый глаз', BlinkRight: 'Правый глаз', Smile: 'Улыбка' };
    const container = document.getElementById('morph-controls');
    container.replaceChildren();
    for (const [name, targets] of morphTargets) {
      const label = document.createElement('label');
      label.className = 'morph';
      const text = document.createElement('span');
      text.textContent = labels[name] || name;
      const value = document.createElement('output');
      const input = document.createElement('input');
      input.type = 'range';
      input.min = '0'; input.max = '1'; input.step = '.01';
      input.value = targets[0].initial;
      input.dataset.morph = name;
      value.textContent = Math.round(Number(input.value) * 100) + '%';
      input.addEventListener('input', () => setMorph(name, input.value));
      label.append(text, value, input);
      container.append(label);
    }
    if (morphTargets.size) {
      const reset = document.createElement('button');
      reset.type = 'button';
      reset.textContent = 'Сбросить мимику';
      reset.addEventListener('click', () => {
        for (const [name, targets] of morphTargets) setMorph(name, targets[0].initial);
      });
      container.append(reset);
      document.getElementById('face-controls').hidden = false;
    }
  }
  api.snapshot = () => ({
    ready: api.ready, error: api.error, view: api.view, theme: api.theme,
    wireframe: api.wireframe, frames: api.frames, stats: api.stats,
    camera: camera.position.toArray(), target: controls.target.toArray(),
    render: { calls: renderer.info.render.calls, triangles: renderer.info.render.triangles },
    morphs: Object.fromEntries([...morphTargets].map(([name, targets]) => [name, targets[0].mesh.morphTargetInfluences[targets[0].index]])),
  });

  async function loadModel() {
    if (api.loading) return;
    api.loading = true;
    api.error = null;
    title.textContent = 'Открываем 3D-модель';
    detail.textContent = 'Загружаем геометрию и материалы…';
    message.hidden = false;
    retry.hidden = true;
    try {
      const response = await fetch('/model.glb', { cache: 'no-store' });
      if (!response.ok) {
        throw new Error(response.status === 404
          ? 'Файл cone-mascot.glb пока не найден. Соберите модель и нажмите «Повторить».'
          : 'Не удалось прочитать GLB: HTTP ' + response.status + '.');
      }
      const buffer = await response.arrayBuffer();
      if (buffer.byteLength < 12 || new DataView(buffer).getUint32(0, true) !== 0x46546c67) {
        throw new Error('Ответ сервера не является файлом GLB. Проверьте путь к 3D-модели.');
      }
      detail.textContent = 'Готовим материалы и освещение…';
      const gltf = await new Promise((resolve, reject) => new THREE.GLTFLoader().parse(buffer, '/', resolve, reject));
      const model = gltf.scene;
      const geometries = new Set();
      const textures = new Set();
      const nodeNames = [];
      let meshCount = 0, triangleCount = 0, vertexCount = 0, boneCount = 0, skinnedMeshCount = 0;
      model.traverse(node => {
        if (node.name) nodeNames.push(node.name);
        if (node.isBone) boneCount += 1;
        if (node.isSkinnedMesh) skinnedMeshCount += 1;
        if (!node.isMesh) return;
        meshCount += 1;
        node.castShadow = true;
        node.receiveShadow = true;
        const geometry = node.geometry;
        triangleCount += (geometry.index ? geometry.index.count : geometry.attributes.position.count) / 3;
        if (!geometries.has(geometry)) {
          geometries.add(geometry);
          vertexCount += geometry.attributes.position.count;
        }
        for (const material of [].concat(node.material)) {
          materials.add(material);
          if ('envMapIntensity' in material) material.envMapIntensity = .45;
          for (const item of Object.values(material)) if (item && item.isTexture) textures.add(item);
        }
        for (const [name, index] of Object.entries(node.morphTargetDictionary || {})) {
          if (!morphTargets.has(name)) morphTargets.set(name, []);
          morphTargets.get(name).push({ mesh: node, index, initial: node.morphTargetInfluences[index] });
        }
      });
      if (!meshCount) throw new Error('В GLB нет полигональных сеток для просмотра.');
      modelBounds = new THREE.Box3().setFromObject(model);
      const size = modelBounds.getSize(new THREE.Vector3());
      if (![size.x, size.y, size.z].every(Number.isFinite) || size.length() <= 0) throw new Error('Границы геометрии GLB некорректны.');
      modelBounds.getCenter(focus);
      floor.position.y = modelBounds.min.y - .007;
      key.target.position.copy(focus);
      scene.add(model);
      if (boneCount) {
        skeletonHelper = new THREE.SkeletonHelper(model);
        skeletonHelper.material.depthTest = false;
        skeletonHelper.visible = false;
        scene.add(skeletonHelper);
        document.getElementById('skeleton').hidden = false;
      }
      api.model = model;
      api.stats = {
        fileBytes: buffer.byteLength, meshCount, geometryCount: geometries.size,
        triangleCount, vertexCount, materialCount: materials.size, textureCount: textures.size,
        boneCount, skinnedMeshCount, morphNames: [...morphTargets.keys()],
        animationNames: gltf.animations.map(clip => clip.name), nodeNames,
        bounds: { min: modelBounds.min.toArray(), max: modelBounds.max.toArray(), size: size.toArray() },
      };
      fitCameraDistance();
      setView('reset');
      controls.saveState();
      addMorphControls();
      document.querySelectorAll('[data-view],#wireframe').forEach(button => button.disabled = false);
      document.getElementById('download').hidden = false;
      document.getElementById('stats').textContent =
        'Сетки: ' + meshCount + ' · Треугольники: ' + Math.round(triangleCount).toLocaleString('ru-RU') +
        ' · GLB: ' + (buffer.byteLength / 1024).toFixed(0) + ' КБ';
      api.loading = false;
      api.ready = true;
      message.hidden = true;
      render();
    } catch (error) {
      fail(error);
    }
  }
  controls.addEventListener('change', render);
  controls.addEventListener('start', () => {
    api.view = 'custom';
    document.querySelectorAll('[data-view]').forEach(button => button.setAttribute('aria-pressed', 'false'));
  });
  document.querySelectorAll('[data-view]').forEach(button => button.addEventListener('click', () => setView(button.dataset.view)));
  document.querySelectorAll('[data-theme]').forEach(button => button.addEventListener('click', () => setTheme(button.dataset.theme)));
  document.getElementById('wireframe').addEventListener('click', () => setWireframe(!api.wireframe));
  document.getElementById('skeleton').addEventListener('click', event => {
    skeletonHelper.visible = !skeletonHelper.visible;
    event.currentTarget.setAttribute('aria-pressed', String(skeletonHelper.visible));
    render();
  });
  new ResizeObserver(resize).observe(stage);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
  renderer.domElement.addEventListener('webglcontextlost', event => {
    event.preventDefault();
    fail(new Error('Браузер потерял 3D-контекст. Перезагрузите страницу, чтобы восстановить просмотр.'), true);
  });
  window.addEventListener('pagehide', event => {
    if (event.persisted) return;
    controls.dispose();
    environment.dispose();
    renderer.dispose();
  }, { once: true });
  resize();
  loadModel();
})();
</script>
</html>
