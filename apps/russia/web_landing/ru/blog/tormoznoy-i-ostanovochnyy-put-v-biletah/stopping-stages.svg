<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img" aria-labelledby="title desc"><title id="title">Из каких этапов складывается остановка</title><desc id="desc">После обнаружения опасности проходят реакция водителя, срабатывание тормозной системы и замедление до полной остановки. Все эти этапы входят в остановочный путь.</desc><rect width="680" height="560" rx="24" fill="#f4f7fb"/><g font-family="Arial,sans-serif"><text x="40" y="60" font-size="29" font-weight="700" fill="#17191e">Остановочный путь: весь процесс</text><rect x="40" y="100" width="600" height="100" rx="16" fill="#e8f2ff"/><text x="62" y="140" font-size="27" fill="#0574f8">1. Реакция водителя</text><text x="62" y="177" font-size="23" fill="#2a2e38">Опасность замечена → начато действие</text><path d="M340 210v30m-10-10 10 10 10-10" fill="none" stroke="#747b88" stroke-width="4"/><rect x="40" y="250" width="600" height="100" rx="16" fill="#fff3d6"/><text x="62" y="291" font-size="27" fill="#775300">2. Срабатывание тормозов</text><text x="62" y="328" font-size="23" fill="#2a2e38">Тормозная система начинает работать</text><path d="M340 360v30m-10-10 10 10 10-10" fill="none" stroke="#747b88" stroke-width="4"/><rect x="40" y="400" width="600" height="100" rx="16" fill="#e8f8f0"/><text x="62" y="441" font-size="27" fill="#18764d">3. Замедление</text><text x="62" y="478" font-size="23" fill="#2a2e38">Скорость уменьшается до нуля</text><text x="40" y="538" font-size="20" fill="#747b88">Учебная схема. Длительности показаны условно.</text></g></svg>