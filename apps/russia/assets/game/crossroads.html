<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Разрули перекресток 3D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <script src="three.min.js"></script>
  <script src="model-edits.js"></script>
  <script src="vehicle-materials.js"></script>
  <script src="vehicles.js"></script>
  <script src="road-materials.js"></script>
  <script src="seasons.js"></script>
  <script src="street-models.js"></script>
  <script src="sign-textures.js"></script>
  <script src="browser-bridge.js"></script>
  <script src="ambient-audio.js"></script>
  <script src="crossroads.js"></script>
</body>
</html>
