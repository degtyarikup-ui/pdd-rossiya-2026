<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img" aria-labelledby="title desc"><title id="title">Три причины плохой видимости</title><desc id="desc">Недостаточная видимость связана с атмосферой и сумерками, ограниченная — с объектами и геометрией дороги, темное время суток — отдельное условие.</desc><rect width="680" height="560" rx="24" fill="#f4f7fb"/><g font-family="Arial,sans-serif"><text x="36" y="60" font-size="29" font-weight="700" fill="#17191e">Что именно мешает видеть?</text><rect x="36" y="100" width="608" height="115" rx="16" fill="#e8f2ff"/><text x="58" y="145" font-size="27" fill="#0574f8">Недостаточная видимость</text><text x="58" y="186" font-size="23" fill="#2a2e38">Туман, дождь, снегопад, сумерки</text><rect x="36" y="245" width="608" height="115" rx="16" fill="#fff3d6"/><text x="58" y="290" font-size="27" fill="#775300">Ограниченная видимость</text><text x="58" y="331" font-size="23" fill="#2a2e38">Поворот, рельеф, здание, другое ТС</text><rect x="36" y="390" width="608" height="115" rx="16" fill="#17191e"/><text x="58" y="435" font-size="27" fill="#fff">Тёмное время суток</text><text x="58" y="476" font-size="23" fill="#fff">Отдельное понятие: время суток</text><text x="36" y="540" font-size="20" fill="#747b88">Учебная схема причин, не новый норматив ПДД.</text></g></svg>