<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" fill="none">
  <title>Конус — маскот ПДД Россия</title>
  <desc>Улыбающийся оранжевый дорожный конус с голубыми глазами и белой перчаткой с поднятым большим пальцем.</desc>
  <style>
#mascot { transform-origin: 240px 380px; animation: breathe 6s ease-in-out infinite; }
#thumb { transform-origin: 124px 334px; animation: affirm 6s ease-in-out infinite; }
#blink-left { transform-origin: 201px 232px; animation: blink-left 6s ease-in-out infinite; }
#blink-right { transform-origin: 283px 218px; animation: blink-right 6s ease-in-out infinite; }
#lid-left { animation: lid-left 6s linear infinite; }
#lid-right { animation: lid-right 6s linear infinite; }
@keyframes breathe {
  0%,50%,100% { transform: translateY(0) rotate(-.7deg); }
  25%,75% { transform: translateY(-4px) rotate(.7deg); }
}
@keyframes affirm {
  0%,15%,44%,100% { transform: rotate(0); }
  25%,36% { transform: rotate(-7deg); }
  31% { transform: rotate(-1deg); }
}
@keyframes blink-left {
  0%,43%,47%,100% { transform: scaleY(1); }
  44.5%,45.5% { transform: scaleY(.03); }
}
@keyframes blink-right {
  0%,43%,47%,73%,81%,100% { transform: scaleY(1); }
  44.5%,45.5%,75%,79% { transform: scaleY(.03); }
}
@keyframes lid-left { 0%,43%,47%,100% {opacity:0;} 44.5%,45.5% {opacity:1;} }
@keyframes lid-right { 0%,43%,47%,73%,81%,100% {opacity:0;} 44.5%,45.5%,75%,79% {opacity:1;} }
.paused * { animation-play-state: paused !important; }
.still * { animation: none !important; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style><defs>
    <linearGradient id="cone" x1="124" y1="260" x2="352" y2="221" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E9540B" /><stop offset=".21" stop-color="#FF8A13" /><stop offset=".52" stop-color="#FFB83F" /><stop offset=".79" stop-color="#FF951D" /><stop offset="1" stop-color="#F36A0C" />
    </linearGradient>
    <linearGradient id="base" x1="158" y1="359" x2="260" y2="443" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB62F" /><stop offset=".48" stop-color="#FF9016" /><stop offset="1" stop-color="#EE620E" />
    </linearGradient>
    <linearGradient id="foot" x1="77" y1="398" x2="405" y2="409" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EE600D" /><stop offset=".48" stop-color="#FF971F" /><stop offset="1" stop-color="#DC4C08" />
    </linearGradient>
    <linearGradient id="white" x1="151" y1="169" x2="310" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D1DCF1" /><stop offset=".36" stop-color="#FAFCFF" /><stop offset=".72" stop-color="#FFFFFF" /><stop offset="1" stop-color="#E4EAF5" />
    </linearGradient>
    <linearGradient id="glove" x1="103" y1="273" x2="173" y2="365" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" /><stop offset=".55" stop-color="#F9FBFF" /><stop offset="1" stop-color="#D7E0F0" />
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="-17" x2="0" y2="19" gradientUnits="userSpaceOnUse">
      <stop stop-color="#164695" /><stop offset=".58" stop-color="#0574F8" /><stop offset="1" stop-color="#5CD4FF" />
    </linearGradient>
    <linearGradient id="mouth" x1="238" y1="251" x2="248" y2="299" gradientUnits="userSpaceOnUse">
      <stop stop-color="#321B22" /><stop offset="1" stop-color="#7C2524" />
    </linearGradient>
    <linearGradient id="tongue" x1="241" y1="284" x2="251" y2="307" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF8791" /><stop offset="1" stop-color="#F0485D" />
    </linearGradient>
    <clipPath id="silhouette"><path d="M113 361 L188 91 C195 64 204 47 226 46 C244 45 253 59 262 82 L365 351 C323 385 165 397 113 361 Z" /></clipPath>
    <clipPath id="smile"><path d="M205 256 C232 269 268 263 294 246 C289 278 274 303 249 306 C228 308 212 290 205 256 Z" /></clipPath>
  </defs>
  <g id="mascot">
