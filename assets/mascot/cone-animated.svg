        <path d="M179 123 C211 111 249 108 279 115 L300 170 C251 162 201 176 161 189 Z" fill="url(#white)" />
        <path d="M130 303 C191 332 297 324 345 302 L361 345 C302 375 171 382 117 348 Z" fill="url(#white)" />
        <path d="M188 90 C196 66 207 53 222 52 C202 94 174 210 149 301" stroke="#FFFFFF" stroke-opacity=".38" stroke-width="5" stroke-linecap="round" />
        <path d="M260 87 L360 350" stroke="#D94B0A" stroke-opacity=".22" stroke-width="9" />
        <path d="M164 354 C213 375 311 365 349 347" stroke="#FFFFFF" stroke-opacity=".44" stroke-width="3" stroke-linecap="round" />
      </g>
      <path d="M200 74 C205 61 212 55 224 54" stroke="#FFF0BE" stroke-width="4" stroke-linecap="round" />
      <path d="M121 358 C172 387 306 381 358 353" stroke="#E9680E" stroke-opacity=".52" stroke-width="3" stroke-linecap="round" />
    </g>
    <g id="face">
