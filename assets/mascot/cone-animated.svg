      <path d="M177 203 C184 188 195 181 209 182" stroke="#4B2B24" stroke-width="11" stroke-linecap="round" />
      <path d="M183 197 C190 188 199 185 207 185" stroke="#73503A" stroke-width="3" stroke-linecap="round" />
      <path d="M269 179 C277 170 289 170 297 177" stroke="#4B2B24" stroke-width="10" stroke-linecap="round" />
      <path d="M274 175 C280 172 286 172 291 174" stroke="#73503A" stroke-width="2.5" stroke-linecap="round" />
      <path d="M171 259 C176 253 185 253 191 257" stroke="#F16B24" stroke-opacity=".6" stroke-width="6" stroke-linecap="round" />
      <path d="M299 243 C304 240 310 242 312 247" stroke="#E56815" stroke-width="4" stroke-linecap="round" />
      <path d="M205 256 C232 269 268 263 294 246 C289 278 274 303 249 306 C228 308 212 290 205 256 Z" fill="url(#mouth)" stroke="#A84519" stroke-width="2.5" stroke-linejoin="round" />
      <g clip-path="url(#smile)">
        <path d="M206 256 C233 267 267 262 294 246 L289 260 C265 277 232 280 211 268 Z" fill="#FFFFFF" />
        <path d="M225 300 C225 283 240 281 249 287 C260 279 276 283 278 294 L263 311 L237 314 Z" fill="url(#tongue)" />
        <path d="M249 288 L250 294" stroke="#D63C52" stroke-width="2" stroke-linecap="round" />
      </g>
      <path d="M220 311 C233 319 250 321 264 314" stroke="#FFD36B" stroke-opacity=".65" stroke-width="3" stroke-linecap="round" />
      <path d="M206 256 C232 269 268 263 294 246" stroke="#7A321C" stroke-width="3.5" stroke-linecap="round" />
    </g>
    <g id="blink-left"><g id="eye-left" transform="translate(201 232)">
      <ellipse rx="26" ry="32" fill="#9E471C" fill-opacity=".25" />
      <ellipse cy="-2" rx="24" ry="30" fill="#FFFFFF" stroke="#563026" stroke-width="3" />
      <g transform="translate(5 -1)">
        <ellipse rx="16" ry="20" fill="url(#iris)" />
        <ellipse cy="-2" rx="10" ry="14" fill="#142C48" />
        <ellipse cx="-5" cy="-9" rx="5" ry="6" fill="#FFFFFF" />
        <circle cx="7" cy="8" r="2.7" fill="#BCEEFF" />
      </g>
    </g>
    </g><g id="blink-right"><g id="eye-right" transform="translate(283 218)">
      <ellipse rx="20" ry="26" fill="#9E471C" fill-opacity=".22" />
      <ellipse cy="-2" rx="19" ry="25" fill="#FFFFFF" stroke="#563026" stroke-width="2.8" />
      <g transform="translate(3 -1)">
        <ellipse rx="13" ry="17" fill="url(#iris)" />
        <ellipse cy="-2" rx="8.5" ry="12" fill="#142C48" />
        <ellipse cx="-4" cy="-8" rx="4.5" ry="5" fill="#FFFFFF" />
        <circle cx="5" cy="7" r="2" fill="#BCEEFF" />
      </g>
    </g>
    </g><g id="lid-left" opacity="0"><path d="M180 232 Q200 246 221 230" stroke="#563026" stroke-width="5" stroke-linecap="round" /></g>
    <g id="lid-right" opacity="0"><path d="M268 218 Q282 228 298 214" stroke="#563026" stroke-width="5" stroke-linecap="round" /></g>
    <g id="thumb">
      <path d="M129 300 C100 294 85 310 88 334 C89 348 102 357 117 354 L137 330 Z" fill="#EB6A13" />
      <path d="M98 322 Q99 305 114 302 L128 305 L134 350 L112 357 Q101 350 98 337 Z" fill="url(#white)" />
      <path d="M116 309 C122 295 119 286 115 275 C111 263 112 251 121 248 C132 244 142 257 145 271 L149 289 C162 286 180 288 185 297 C190 304 186 311 181 314 C192 317 194 326 188 333 C195 340 190 352 183 356 C185 365 176 374 162 377 L143 380 C123 381 109 370 107 355 C105 342 109 324 116 309 Z" fill="url(#glove)" stroke="#CDD7E8" stroke-width="1.8" stroke-linejoin="round" />
      <path d="M150 311 C159 307 174 307 180 312 M152 331 C164 327 177 328 185 331 M150 351 C163 347 176 348 183 352" stroke="#BDCBE2" stroke-opacity=".78" stroke-width="2.5" stroke-linecap="round" />
      <path d="M122 258 C128 260 132 270 133 279" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
      <path d="M116 329 C112 348 118 363 133 367" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
