name: pdd_app
description: "ПДД Россия 2026 — билеты и экзамен"
publish_to: 'none'
version: 2.2.3+56

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  flutter_svg: ^2.2.4
  path_provider: ^2.1.5
  flutter_tts: ^4.2.3
  url_launcher: ^6.3.1
  http: ^1.6.0
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.0
  web: ^1.1.1
  share_plus: ^13.2.1
  qr_flutter: ^4.1.0
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  in_app_review: ^2.0.12
  audioplayers: ^6.8.1
  google_sign_in: ^6.2.2
  google_sign_in_web: ^0.12.4+4
  google_identity_services_web: ^0.3.3+1
  sign_in_with_apple: ^6.1.4
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.14.0
  in_app_purchase: ^3.2.0
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.7
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

  webview_flutter_platform_interface: any
  in_app_purchase_platform_interface: ^1.4.1
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/app_icon.png

flutter:
  uses-material-design: true
  generate: true

  # Фирменный шрифт приложения. Onest — свободная лицензия SIL OFL 1.1
  # (текст лицензии лежит рядом: assets/fonts/Onest-OFL.txt), поддерживает
  # кириллицу и латиницу с сербскими диакритиками — то есть все три страны.
  #
  # Начертания получены из вариативного Onest[wght].ttf инстансированием
  # (fontTools varLib.instancer): в репозитории Google Fonts статических
  # файлов нет, а вариативный шрифт Flutter не умеет корректно раскладывать
  # по fontWeight без fontVariations.
  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Regular.ttf
          weight: 400
        - asset: assets/fonts/Onest-Medium.ttf
          weight: 500
        - asset: assets/fonts/Onest-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Onest-Bold.ttf
          weight: 700
        - asset: assets/fonts/Onest-ExtraBold.ttf
          weight: 800

  assets:
    # Общие (страно-независимые) ресурсы.
    - assets/images/
    - assets/images/category_icons/
    - assets/images/tips/
    - assets/images/achievements/
    - assets/images/games/
    - assets/icons/auth/
    - assets/icons/game/
    - assets/audio/
    - assets/audio/feed/
    - assets/game/
    # Контент России.
    - assets/countries/ru/questions/
    - assets/countries/ru/images/questions_ab/
    - assets/countries/ru/images/questions_cd/
    - assets/countries/ru/images/signs/
    - assets/countries/ru/images/markup/
