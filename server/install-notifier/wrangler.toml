name = "pdd-install-notifier"
main = "worker.js"
compatibility_date = "2024-11-01"

# Секреты (BOT_TOKEN, CHAT_ID, SHARED_SECRET) в этот файл НЕ пишем —
# они задаются командой `wrangler secret put <ИМЯ>` и хранятся в Cloudflare.

# Порядковый номер пользователя (#1, #2, …) требует хранилища KV.
#   1) создать:  wrangler kv namespace create INSTALLS
#   2) вставить выданный id ниже и раскомментировать блок:
# [[kv_namespaces]]
# binding = "INSTALLS"
# id = "<сюда id из шага 1>"

[[kv_namespaces]]
binding = "INSTALLS"
id = "2c854aacc0b7483f9cb271c19a79ba5a"

# Отчеты в Telegram 2 раза в день: 10:00 МСК (07:00 UTC) и 22:00 МСК (19:00 UTC).
[triggers]
# Ежечасный триггер (5 минут каждого часа) — автопостинг в Instagram/YouTube:
# у каждого аккаунта своё время публикации по МСК.
crons = ["0 7 * * *", "0 19 * * *", "*/5 * * * *"]

# Буфер статистики (stats_buffer.js): копит события аналитики и пишет их в KV
# пачкой раз в 10 минут, чтобы не выходить за бесплатный лимит записей KV.
[durable_objects]
bindings = [{ name = "STATS", class_name = "StatsBuffer" }, { name = "PURCHASE_CLAIMS", class_name = "PurchaseClaims" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StatsBuffer"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PurchaseClaims"]
