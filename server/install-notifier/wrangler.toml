name = "pdd-install-notifier"
main = "worker.js"
compatibility_date = "2024-11-01"
upload_source_maps = true

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = false

[vars]
ACCOUNT_STATE_REQUIRED = "true"
SOCIAL_PUBLISHER_REQUIRED = "true"
AI_GLOBAL_DAILY_LIMIT = "5000"
AI_LEGACY_EXPLANATIONS = "true"
AI_LEGACY_UNTIL = "2026-11-18T00:00:00Z"
# Старые iOS-сборки (до 2.2.4) не передают appAccountToken: до этой даты их
# новая покупка привязывается к первому заявителю, как раньше.
APPLE_LEGACY_CLAIMS_UNTIL = "2027-01-31T00:00:00Z"
# Смена номера заставляет AccountState заново импортировать документы из KV
# (нужно только после отката на старый Worker, см. account-state-rollout.md).
ACCOUNT_STATE_EPOCH = "1"
TELEGRAM_TOPIC_ERRORS = "7"
TELEGRAM_TOPIC_PURCHASES = "8"
TELEGRAM_TOPIC_REGISTRATIONS = "9"

# Секреты (BOT_TOKEN, CHAT_ID, SHARED_SECRET) в этот файл НЕ пишем —
# они задаются командой `wrangler secret put <ИМЯ>` и хранятся в Cloudflare.

# Порядковый номер пользователя (#1, #2, …) требует хранилища KV.
#   1) создать:  wrangler kv namespace create INSTALLS
#   2) вставить выданный id ниже и раскомментировать блок:
# [[kv_namespaces]]
# binding = "INSTALLS"
# id = "<сюда id из шага 1>"

[[kv_namespaces]]
binding = "INSTALLS"
id = "2c854aacc0b7483f9cb271c19a79ba5a"

# Отчеты в Telegram 2 раза в день: 10:00 МСК (07:00 UTC) и 22:00 МСК (19:00 UTC).
[triggers]
# Воскресенье 21:05 UTC = понедельник 00:05 МСК: закрытие недельного рейтинга игры.
# Ежечасный триггер (5 минут каждого часа) — автопостинг в Instagram/YouTube:
# у каждого аккаунта своё время публикации по МСК.
crons = ["0 19 * * *", "*/5 * * * *", "5 21 * * SUN"]

# Аналитика (stats_buffer.js): durable-очередь, пачки раз в 5 минут.
# TrafficState сериализует счётчики и рейтинг; TelegramQueue повторяет доставку.
[durable_objects]
bindings = [{ name = "ACCOUNTS", class_name = "AccountState" }, { name = "AI_QUOTAS", class_name = "AiQuotaState" }, { name = "STATS", class_name = "StatsBuffer" }, { name = "PURCHASE_CLAIMS", class_name = "PurchaseClaims" }, { name = "TRAFFIC", class_name = "TrafficState" }, { name = "TELEGRAM", class_name = "TelegramQueue" }, { name = "NOTIFICATIONS", class_name = "NotificationsState" }, { name = "SUPPORT", class_name = "SupportThread" }, { name = "TG_AUTH", class_name = "TelegramAuthState" }, { name = "SOCIAL_PUBLISHER", class_name = "SocialPublisher" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StatsBuffer"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PurchaseClaims"]

[[migrations]]
tag = "v3-traffic"
new_sqlite_classes = ["TrafficState", "TelegramQueue"]

[[migrations]]
tag = "v4-notifications"
new_sqlite_classes = ["NotificationsState"]

[[migrations]]
tag = "v5-support"
new_sqlite_classes = ["SupportThread"]

[[migrations]]
tag = "v6-telegram-auth"
new_sqlite_classes = ["TelegramAuthState"]

[[migrations]]
tag = "v7-accounts-and-ai-quotas"
new_sqlite_classes = ["AccountState", "AiQuotaState"]

[[migrations]]
tag = "v8-social-publisher"
new_sqlite_classes = ["SocialPublisher"]
