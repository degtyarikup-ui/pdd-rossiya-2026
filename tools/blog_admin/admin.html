<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админка блога — ПДД Россия 2026</title>
<style>
  :root{
    --accent:#0574F8; --accent-s:rgba(5,116,248,.1); --text:#121212; --muted:#A1A6B7;
    --bg:#F8F8FA; --card:#fff; --line:#E8E8E8; --green:#34A853; --red:#EA4335; --gold:#FFA53C;
    --r:16px; --rb:12px; --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px}
  a{color:var(--accent)}
  .app{display:grid;grid-template-columns:280px 1fr;height:100vh}
  /* Сайдбар */
  .side{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  .side-head{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
  .side-head b{font-size:15px}
  .side-head .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .side-list{flex:1;overflow:auto;padding:8px}
  .side-item{padding:12px 12px;border-radius:var(--rb);cursor:pointer;margin-bottom:4px}
  .side-item:hover{background:var(--bg)}
  .side-item.active{background:var(--accent-s)}
  .side-item .t{font-weight:600;font-size:13.5px;line-height:1.3}
  .side-item .m{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;gap:8px;align-items:center}
  .badge{font-size:10.5px;padding:1px 7px;border-radius:20px;font-weight:600}
  .badge.pub{background:#E6F7DE;color:var(--green)}
  .badge.draft{background:#FFF1E6;color:var(--gold)}
  .side-foot{padding:12px}
  /* Кнопки */
  .btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;border:none;border-radius:var(--rb);
    padding:11px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s}
  .btn:hover{opacity:.9}
  .btn-primary{background:var(--accent);color:#fff;width:100%}
  .btn-ghost{background:var(--bg);color:var(--text);border:1px solid var(--line)}
  .btn-green{background:var(--green);color:#fff}
  .btn-sm{padding:7px 12px;font-size:13px}
  /* Основная область */
  .main{overflow:auto;padding:0}
  .topbar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);
    padding:12px 24px;display:flex;gap:10px;align-items:center;justify-content:flex-end}
  .topbar .sp{flex:1}
  .topbar .status{font-size:13px;color:var(--muted)}
  .editor{max-width:860px;margin:0 auto;padding:24px}
  .empty{max-width:860px;margin:0 auto;padding:80px 24px;text-align:center;color:var(--muted)}
  .field{margin-bottom:18px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  .field .hint{font-weight:400;color:var(--muted);font-size:12px}
  .field input[type=text],.field input[type=date],.field input[type=number],.field textarea{
    width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:var(--rb);font-family:inherit;
    font-size:14px;background:#fff;color:var(--text)}
  .field input:focus,.field textarea:focus,.editor-body:focus{outline:2px solid var(--accent-s);border-color:var(--accent)}
  .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .counter{float:right;font-size:12px;color:var(--muted)}
  .counter.bad{color:var(--red)}
  .check{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;cursor:pointer}
  /* Обложка */
  .cover-box{display:flex;gap:16px;align-items:center}
  .cover-prev{width:200px;height:105px;border:1px solid var(--line);border-radius:var(--rb);
    background:var(--bg) center/cover no-repeat;flex:none;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:12px}
  /* Тулбар редактора */
  .toolbar{display:flex;flex-wrap:wrap;gap:4px;border:1px solid var(--line);border-bottom:none;
    border-radius:var(--rb) var(--rb) 0 0;padding:8px;background:var(--bg)}
  .toolbar button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:13px;
    cursor:pointer;font-family:inherit;min-width:34px}
  .toolbar button:hover{background:var(--accent-s);border-color:var(--accent)}
  .toolbar .div{width:1px;background:var(--line);margin:2px 4px}
  .editor-body{border:1px solid var(--line);border-radius:0 0 var(--rb) var(--rb);padding:16px 18px;min-height:340px;
    background:#fff;font-size:15.5px;line-height:1.6}
  .editor-body h2{font-size:22px;margin:18px 0 8px}
  .editor-body h3{font-size:18px;margin:14px 0 6px}
  .editor-body p{margin:0 0 12px}
  .editor-body ul,.editor-body ol{margin:0 0 12px 22px}
  .editor-body table{border-collapse:collapse;width:100%;margin:12px 0}
  .editor-body th,.editor-body td{border:1px solid var(--line);padding:8px 10px;text-align:left}
  .editor-body th{background:var(--bg)}
  .editor-body .note{background:#E8F2FE;border-radius:var(--r);padding:14px 16px;margin:14px 0}
  .editor-body img{max-width:100%;border-radius:var(--rb)}
  /* FAQ */
  .faq-item{border:1px solid var(--line);border-radius:var(--rb);padding:12px;margin-bottom:10px;background:#fff}
  .faq-item input,.faq-item textarea{width:100%;padding:10px 12px;border:1px solid var(--line);
    border-radius:var(--rb);font-family:inherit;font-size:14px;background:#fff;color:var(--text)}
  .faq-item input{margin-bottom:8px;font-weight:600}
  .faq-item textarea{min-height:72px;resize:vertical;line-height:1.5}
  .faq-item input:focus,.faq-item textarea:focus{outline:2px solid var(--accent-s);border-color:var(--accent)}
  .faq-del{color:var(--red);background:none;border:none;cursor:pointer;font-size:13px;font-weight:600}
  /* Тост */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;
    padding:12px 20px;border-radius:var(--rb);font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:80vw}
  .toast.show{opacity:1}
  .toast.err{background:var(--red)}
  .sec-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:26px 0 10px}
  dialog{border:none;border-radius:var(--r);padding:0;max-width:520px;width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  dialog::backdrop{background:rgba(0,0,0,.4)}
  .dlg{padding:22px}
  .dlg h3{margin-bottom:12px}
  .dlg pre{background:var(--bg);border-radius:var(--rb);padding:12px;font-size:12.5px;white-space:pre-wrap;max-height:300px;overflow:auto}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="side-head">
      <b>Блог ПДД Россия 2026</b>
      <div class="sub">Админка · черновики видно только здесь</div>
    </div>
    <div class="side-list" id="list"></div>
    <div class="side-foot">
      <button class="btn btn-primary" onclick="newArticle()">+ Новая статья</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <span class="status" id="status"></span>
      <div class="sp"></div>
      <button class="btn btn-ghost btn-sm" onclick="preview()">Предпросмотр</button>
      <button class="btn btn-ghost btn-sm" onclick="save()">Сохранить</button>
      <button class="btn btn-green btn-sm" onclick="publish()">Опубликовать на сайт</button>
    </div>
    <div id="editorWrap"><div class="empty">Выберите статью слева или создайте новую.</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<dialog id="deployDlg"><div class="dlg"><h3>Публикация на pdd-drive.ru</h3><pre id="deployLog">Запускаю…</pre>
  <div style="text-align:right;margin-top:14px"><button class="btn btn-ghost btn-sm" onclick="deployDlg.close()">Закрыть</button></div></div></dialog>

<script>
"use strict";
let current = null;      // текущий source.json в редакторе
let isNew = false;

const $ = s => document.querySelector(s);
function toast(msg, err){ const t=$("#toast"); t.textContent=msg; t.className="toast show"+(err?" err":""); setTimeout(()=>t.className="toast",2600); }
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

// --- транслитерация для slug ---
const TR={а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ё:"e",ж:"zh",з:"z",и:"i",й:"y",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"h",ц:"c",ч:"ch",ш:"sh",щ:"sch",ъ:"",ы:"y",ь:"",э:"e",ю:"yu",я:"ya"," ":"-"};
function slugify(s){ return (s||"").toLowerCase().split("").map(c=>TR[c]!==undefined?TR[c]:c).join("").replace(/[^a-z0-9-]+/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,"").slice(0,70); }

// --- список статей ---
async function loadList(sel){
  const arts = await (await fetch("/api/articles")).json();
  const el = $("#list"); el.innerHTML="";
  arts.forEach(a=>{
    const d=document.createElement("div");
    d.className="side-item"+(current&&current.slug===a.slug?" active":"");
    d.onclick=()=>openArticle(a.slug);
    d.innerHTML=`<div class="t">${esc(a.title)}</div><div class="m">${a.datePublished||""}
      <span class="badge ${a.published?"pub":"draft"}">${a.published?"опубл.":"черновик"}</span></div>`;
    el.appendChild(d);
  });
  if(sel) [...el.children].forEach(c=>{});
}

async function openArticle(slug){
  const a = await (await fetch("/api/articles/"+slug)).json();
  current=a; isNew=false; renderEditor(); loadList();
}
function newArticle(){
  current={schema:1,slug:"",title:"",shortTitle:"",description:"",datePublished:new Date().toISOString().slice(0,10),
    readingMinutes:6,cover:null,coverAlt:null,bodyHtml:"<p></p>",faq:[],published:false};
  isNew=true; renderEditor(); loadList();
}

// --- редактор ---
function renderEditor(){
  const a=current;
  $("#editorWrap").innerHTML=`
  <div class="editor">
    <div class="field"><label>Заголовок статьи (h1)</label>
      <input type="text" id="f-title" value="${esc(a.title)}"></div>
    <div class="row">
      <div class="field"><label>Короткий заголовок <span class="hint">для title/OG</span>
        <span class="counter" id="c-short"></span></label>
        <input type="text" id="f-short" value="${esc(a.shortTitle||"")}"></div>
      <div class="field"><label>Slug (адрес) ${isNew?'<span class="hint">авто</span>':'<span class="hint">не меняется</span>'}</label>
        <input type="text" id="f-slug" value="${esc(a.slug)}" ${isNew?"":"readonly"}></div>
      <div class="field"><label>Дата публикации</label>
        <input type="date" id="f-date" value="${esc(a.datePublished)}"></div>
    </div>
    <div class="field"><label>Описание <span class="hint">meta description, 140–160 симв.</span>
      <span class="counter" id="c-desc"></span></label>
      <textarea id="f-desc" rows="2">${esc(a.description)}</textarea></div>
    <div class="row">
      <div class="field"><label>Время чтения (мин)</label>
        <input type="number" id="f-mins" value="${a.readingMinutes||6}" min="1" max="60"></div>
      <div class="field" style="grid-column:span 2;align-self:end">
        <label class="check"><input type="checkbox" id="f-pub" ${a.published?"checked":""}> Опубликована (иначе черновик — виден только в предпросмотре)</label></div>
    </div>

    <div class="sec-title">Обложка</div>
    <div class="cover-box">
      <div class="cover-prev" id="coverPrev" style="${a.cover?`background-image:url(/blog/${a.slug}/${a.cover})`:""}">${a.cover?"":"нет обложки"}</div>
      <div>
        <button class="btn btn-ghost btn-sm" onclick="pickFile(uploadCover)">Загрузить обложку</button>
        <div class="field" style="margin-top:10px;margin-bottom:0"><label>Alt обложки</label>
          <input type="text" id="f-coveralt" value="${esc(a.coverAlt||"")}" style="width:320px"></div>
      </div>
    </div>

    <div class="sec-title">Текст статьи</div>
    <div class="toolbar">
      <button onclick="fmt('formatBlock','p')" title="Абзац">¶</button>
      <button onclick="fmt('formatBlock','h2')" title="Заголовок 2">H2</button>
      <button onclick="fmt('formatBlock','h3')" title="Заголовок 3">H3</button>
      <span class="div"></span>
      <button onclick="fmt('bold')" title="Жирный"><b>Ж</b></button>
      <button onclick="fmt('italic')" title="Курсив"><i>К</i></button>
      <span class="div"></span>
      <button onclick="fmt('insertUnorderedList')" title="Список">•—</button>
      <button onclick="fmt('insertOrderedList')" title="Нумерованный">1.</button>
      <span class="div"></span>
      <button onclick="addLink()" title="Ссылка">🔗</button>
      <button onclick="addTable()" title="Таблица">▦</button>
      <button onclick="addNote()" title="Блок-выноска">❝</button>
      <button onclick="pickFile(insertImage)" title="Картинка">🖼</button>
    </div>
    <div class="editor-body" id="body" contenteditable="true">${a.bodyHtml||"<p></p>"}</div>

    <div class="sec-title">Частые вопросы (FAQ)</div>
    <div id="faqList"></div>
    <button class="btn btn-ghost btn-sm" onclick="addFaq()">+ Вопрос</button>
  </div>`;
  renderFaq();
  ["f-title","f-short","f-desc"].forEach(id=>$("#"+id).addEventListener("input",updateCounters));
  $("#f-title").addEventListener("input",()=>{ if(isNew){ $("#f-slug").value=slugify($("#f-title").value); if(!$("#f-short").value) $("#f-short").value=$("#f-title").value; }});
  updateCounters();
}

function updateCounters(){
  const s=($("#f-short").value||$("#f-title").value).length, d=$("#f-desc").value.length;
  const cs=$("#c-short"), cd=$("#c-desc");
  if(cs){ cs.textContent=s+" / ≤62"; cs.className="counter"+(s>62?" bad":""); }
  if(cd){ cd.textContent=d+" / 140–160"; cd.className="counter"+((d<120||d>165)?" bad":""); }
}

// --- FAQ ---
function renderFaq(){
  const el=$("#faqList"); el.innerHTML="";
  (current.faq||[]).forEach((q,i)=>{
    const d=document.createElement("div"); d.className="faq-item";
    d.innerHTML=`<input type="text" class="q" placeholder="Вопрос" value="${esc(q.q)}">
      <textarea class="faq-a a" placeholder="Ответ (1–3 предложения)">${esc(q.aHtml)}</textarea>
      <div style="text-align:right"><button class="faq-del" onclick="delFaq(${i})">Удалить</button></div>`;
    d.querySelector(".q").addEventListener("input",e=>current.faq[i].q=e.target.value);
    d.querySelector(".a").addEventListener("input",e=>current.faq[i].aHtml=e.target.value);
    el.appendChild(d);
  });
}
function addFaq(){ current.faq=current.faq||[]; current.faq.push({q:"",aHtml:""}); renderFaq(); }
function delFaq(i){ current.faq.splice(i,1); renderFaq(); }

// --- форматирование ---
function fmt(cmd,val){ document.execCommand(cmd,false,val||null); $("#body").focus(); }
function addLink(){ const u=prompt("URL ссылки:","https://"); if(u) document.execCommand("createLink",false,u); }
function addNote(){ document.execCommand("insertHTML",false,'<div class="note">Текст выноски…</div><p></p>'); }
function addTable(){
  const n=parseInt(prompt("Сколько строк данных (без шапки)?","3"),10)||3;
  let t='<table><tr><th>Параметр</th><th>Значение</th></tr>';
  for(let i=0;i<n;i++) t+='<tr><td>—</td><td>—</td></tr>';
  t+='</table><p></p>'; document.execCommand("insertHTML",false,t);
}

// --- загрузка файлов ---
function pickFile(cb){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*";
  inp.onchange=()=>{ if(inp.files[0]) cb(inp.files[0]); }; inp.click();
}
async function doUpload(file){
  const slug=$("#f-slug").value.trim();
  if(!slug){ toast("Сначала введите заголовок (slug)",true); return null; }
  const buf=await file.arrayBuffer();
  const r=await fetch("/api/upload?slug="+encodeURIComponent(slug),{method:"POST",
    headers:{"X-Filename":encodeURIComponent(file.name),"Content-Type":"application/octet-stream"},body:buf});
  const j=await r.json();
  if(!j.ok){ toast(j.error||"ошибка загрузки",true); return null; }
  return j;
}
async function uploadCover(file){
  const j=await doUpload(file); if(!j) return;
  current.cover=j.file;
  $("#coverPrev").style.backgroundImage=`url(${j.url}?t=${Date.now()})`; $("#coverPrev").textContent="";
  if(!$("#f-coveralt").value) $("#f-coveralt").value=$("#f-title").value;
  toast("Обложка загружена");
}
async function insertImage(file){
  const j=await doUpload(file); if(!j) return;
  const alt=prompt("Описание картинки (alt):","")||"";
  $("#body").focus();
  document.execCommand("insertHTML",false,`<img src="${j.url}" alt="${esc(alt)}" loading="lazy"><p></p>`);
  toast("Картинка вставлена");
}

// --- очистка HTML тела ---
function cleanBody(root){
  root.querySelectorAll("[style]").forEach(e=>e.removeAttribute("style"));
  root.querySelectorAll('[class]').forEach(e=>{ if(!["note","post-cover"].includes(e.getAttribute("class"))) e.removeAttribute("class"); });
  root.querySelectorAll("span,font").forEach(e=>{ const t=document.createTextNode(e.textContent); e.replaceWith(t); });
  root.querySelectorAll("div:not(.note)").forEach(e=>{ const p=document.createElement("p"); p.innerHTML=e.innerHTML; e.replaceWith(p); });
  return root.innerHTML.replace(/<p><\/p>/g,"").replace(/&nbsp;/g," ").trim();
}

function collect(){
  const tmp=document.createElement("div"); tmp.innerHTML=$("#body").innerHTML;
  return {
    schema:1, slug:$("#f-slug").value.trim(),
    title:$("#f-title").value.trim(), shortTitle:$("#f-short").value.trim(),
    description:$("#f-desc").value.trim(), datePublished:$("#f-date").value,
    dateModified:current.dateModified||$("#f-date").value,
    readingMinutes:parseInt($("#f-mins").value,10)||6,
    cover:current.cover||null, coverAlt:$("#f-coveralt").value.trim()||null,
    bodyHtml:cleanBody(tmp),
    faq:(current.faq||[]).filter(q=>q.q.trim()),
    published:$("#f-pub").checked
  };
}

async function save(){
  if(!current){ return; }
  const data=collect();
  if(!data.title){ toast("Заполните заголовок",true); return; }
  if(!data.slug){ toast("Пустой slug",true); return; }
  $("#status").textContent="Сохраняю…";
  const r=await fetch("/api/articles",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
  const j=await r.json();
  if(!j.ok){ toast(j.error||"ошибка",true); $("#status").textContent=""; return; }
  current=data; isNew=false;
  $("#status").textContent="Сохранено"+(j.warnings&&j.warnings.length?" · "+j.warnings.join("; "):"");
  toast("Сохранено");
  loadList();
  return true;
}
function preview(){
  const slug=$("#f-slug").value.trim(); if(!slug){ toast("Нет slug",true); return; }
  save().then(()=>window.open("/blog/"+slug+"/","_blank"));
}
async function publish(){
  if(!(await save())) return;
  if(!confirm("Опубликовать блог на pdd-drive.ru? Это перезапишет сайт и отправит пинг в поисковики.")) return;
  const dlg=$("#deployDlg"); $("#deployLog").textContent="Собираю и публикую… (это занимает ~1 минуту)"; dlg.showModal();
  const r=await fetch("/api/deploy",{method:"POST"});
  const j=await r.json();
  $("#deployLog").textContent=(j.ok?"✅ Опубликовано\n\n":"⚠️ Проблема\n\n")+(j.log||j.error||"");
}

loadList();
</script>
</body>
</html>
