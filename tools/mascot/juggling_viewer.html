<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Конус-жонглёр · загрузка</title>
<style>
  :root { color-scheme:light; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#17263b; background:#f7f8fb; }

  body { margin:0; padding:28px 22px; }

  h1 { font-size:clamp(24px,4vw,31px); font-weight:650; letter-spacing:-.9px; margin:0 0 5px; }
  p { margin:0; font-size:13px; color:#7c879a; line-height:1.5; }

  .stage[data-theme="dark"] { background:#141b28; }
  .stage[data-theme="blue"] { background:#0574f8; }

  #viewport { width:480px; height:480px; }
  canvas { width:100%; height:100%; display:block; touch-action:none; cursor:grab; outline:none; }

  .status { font-size:15px; font-weight:500; color:#526783; letter-spacing:.05px; }
  .stage[data-theme="dark"] .status { color:#bdcde2; }
  .stage[data-theme="blue"] .status { color:#fff; }

  .message strong { font-weight:600; font-size:16px; }
  .message p { max-width:540px; overflow-wrap:anywhere; }
  [hidden] { display:none !important; }
  .controls { display:flex; justify-content:space-between; flex-wrap:wrap; gap:16px; margin-top:18px; }
  .group { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  button { font:inherit; font-size:13px; background:#e9eef5; color:#40536d; border:0; border-radius:10px; padding:10px 13px; min-height:42px; cursor:pointer; }
  button:hover { background:#e0e8f3; }
  button[aria-pressed="true"] { color:#fff; background:#0574f8; }
  button:disabled { opacity:.4; cursor:default; }
  button:focus-visible,select:focus-visible,canvas:focus-visible { outline:3px solid #87b8fa; outline-offset:3px; }
  footer { display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-top:18px; font-size:12px; color:#8993a3; }
  #motion-note { margin-top:12px; font-size:12px; }
  @media(max-width:560px) { body { padding:20px 14px; } .stage { border-radius:20px; height:clamp(380px,66vh,560px); } .controls { gap:12px; } button { padding:10px 11px; } }
</style>
<main>
  <header><div><h1 data-text="title">Конус-жонглёр</h1><p data-text="subtitle">Анимация загрузки</p></div><select id="language" aria-label="Язык"><option value="ru">RU</option><option value="en">EN</option><option value="kk">ҚАЗ</option></select></header>

    <div class="message" id="message" role="status" aria-live="polite"><strong id="message-title">Открываем 3D-анимацию</strong><p id="message-detail"></p><button id="retry" hidden data-text="retry">Повторить</button></div>

    <div class="group"><button data-size="72" aria-pressed="false">72</button><button data-size="120" aria-pressed="false">120</button><button data-size="240" aria-pressed="false">240</button><button data-size="480" aria-pressed="true" data-text="large">Крупно</button></div>
    <div class="group"><button data-theme="light" aria-pressed="true" data-text="light">Светлый</button><button data-theme="dark" aria-pressed="false" data-text="dark">Тёмный</button><button data-theme="blue" aria-pressed="false" data-text="blue">Синий</button></div>
  </div>

</main>
<script src="/vendor/three.min.js"></script>
<script src="/vendor/GLTFLoader.js"></script>
<script src="/vendor/OrbitControls.js"></script>
<script src="/vendor/RoomEnvironment.js"></script>
<script>
(() => {
  'use strict';
  const dictionaries = {
    ru:{title:'Конус-жонглёр',subtitle:'Анимация загрузки',loading:'Загрузка…',done:'Готово',opening:'Открываем 3D-анимацию',reading:'Загружаем модель и движение…',failed:'Не удалось открыть анимацию',missing:'Файл cone-juggling.glb пока не собран. Нажмите «Повторить» после сборки.',retry:'Повторить',replay:'Заново',finish:'Завершить',large:'Крупно',light:'Светлый',dark:'Тёмный',blue:'Синий',pause:'Пауза',play:'Воспроизвести',hint:'Можно слегка повернуть мышью или пальцем',reduced:'Движение уменьшено в настройках системы. Запуск — кнопкой воспроизведения.',loop:'Цикл',seconds:'с',language:'Язык',canvas:'Конус жонглирует тремя шарами. Анимация загрузки.'},
    en:{title:'The juggling cone',subtitle:'Loading animation',loading:'Loading…',done:'Ready',opening:'Opening the 3D animation',reading:'Loading the model and motion…',failed:'Could not open the animation',missing:'cone-juggling.glb has not been built yet. Select Retry after building it.',retry:'Retry',replay:'Replay',finish:'Finish',large:'Large',light:'Light',dark:'Dark',blue:'Blue',pause:'Pause',play:'Play',hint:'Drag gently with a mouse or finger to turn',reduced:'Reduced motion is enabled in system settings. Use Play to start.',loop:'Loop',seconds:'s',language:'Language',canvas:'A cone juggling three balls. Loading animation.'},
    kk:{title:'Жонглёр конус',subtitle:'Жүктеу анимациясы',loading:'Жүктелуде…',done:'Дайын',opening:'3D анимациясы ашылуда',reading:'Модель мен қозғалыс жүктелуде…',failed:'Анимацияны ашу мүмкін болмады',missing:'cone-juggling.glb файлы әлі жасалмаған. Жасалғаннан кейін «Қайталау» түймесін басыңыз.',retry:'Қайталау',replay:'Қайта бастау',finish:'Аяқтау',large:'Үлкейту',light:'Ашық',dark:'Қараңғы',blue:'Көк',pause:'Кідірту',play:'Ойнату',hint:'Бұру үшін тінтуірмен немесе саусақпен ақырын жылжытыңыз',reduced:'Жүйе баптауларында қозғалыс азайтылған. Бастау үшін ойнату түймесін басыңыз.',loop:'Цикл',seconds:'с',language:'Тіл',canvas:'Үш доппен жонглёрлік жасайтын конус. Жүктеу анимациясы.'},
  };
  let language = new URLSearchParams(location.search).get('lang') || 'ru';
  if (!dictionaries[language]) language = 'ru';
  const text = key => dictionaries[language][key];
  const stage = document.getElementById('stage');
  const viewport = document.getElementById('viewport');
  const message = document.getElementById('message');
  const reducedQuery = matchMedia('(prefers-reduced-motion: reduce)');
  let wantsPlaying = !reducedQuery.matches, explicitMotion = false, inViewport = true;
  let raf = null, lastTick = null, lastPaint = null, speed = 1, size = 480;
  let loopAction = null, finishAction = null, pendingFinish = false, mode = 'loop';
  let model = null, mixer = null, animatedBounds = null, renderer = null;
  const api = window.jugglingScene = {ready:false,loading:false,error:null,playing:false,frames:0,stats:null};
  function localize() {
    document.documentElement.lang = language;
    document.title = text('title') + ' · ' + text('subtitle');
    document.querySelectorAll('[data-text]').forEach(node => node.textContent = text(node.dataset.text));
    document.getElementById('language').value = language;
    document.getElementById('language').setAttribute('aria-label', text('language'));
    document.getElementById('status').textContent = text(mode === 'complete' ? 'done' : 'loading');
    document.getElementById('play').textContent = text(wantsPlaying ? 'pause' : 'play');
    document.getElementById('play').setAttribute('aria-pressed', String(!wantsPlaying));
    document.querySelector('[data-speed=".5"]').textContent = language === 'en' ? '0.5×' : '0,5×';
    document.getElementById('motion-note').hidden = !reducedQuery.matches;
    if (renderer) renderer.domElement.setAttribute('aria-label', text('canvas'));
    if (!api.ready && !api.error) {
      document.getElementById('message-title').textContent = text('opening');
      document.getElementById('message-detail').textContent = text('reading');
    }
    if (api.stats) document.getElementById('stats').textContent =
      text('loop') + ' ' + api.stats.duration.toFixed(1).replace('.', language === 'en' ? '.' : ',') + ' ' + text('seconds') + ' · ≤30 fps · ' + Math.round(api.stats.fileBytes / 1024) + ' KB';
  }
  function fail(error, reload = false) {
    api.error = error instanceof Error ? error.message : String(error);
    api.loading = false; api.ready = false; sync();
    document.getElementById('message-title').textContent = text('failed');
    document.getElementById('message-detail').textContent = api.error;
    message.hidden = false;
    const retry = document.getElementById('retry');
    retry.hidden = false;
    retry.onclick = reload ? () => location.reload() : load;
    console.error('Juggling viewer:', error);
  }
  localize();
  if (!window.THREE || !THREE.GLTFLoader || !THREE.OrbitControls || !THREE.RoomEnvironment) {
    fail(new Error('Local Three.js dependencies unavailable. Open through tools/mascot/serve_model.py.'), true);
    return;
  }
  try { renderer = new THREE.WebGLRenderer({antialias:true,alpha:false}); }
  catch (error) { fail(new Error('WebGL: ' + error.message), true); return; }
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = .85;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.domElement.tabIndex = 0;
  viewport.append(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xedf2f8);
  const camera = new THREE.PerspectiveCamera(32, 1, .01, 100);
  camera.position.set(.5, 1.6, 6);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = false; controls.autoRotate = false;
  controls.enablePan = false; controls.enableZoom = false;
  controls.minAzimuthAngle = -.45; controls.maxAzimuthAngle = .45;
  controls.minPolarAngle = 1.32; controls.maxPolarAngle = 1.65;
  controls.rotateSpeed = .45;
  const room = new THREE.RoomEnvironment();
  const pmrem = new THREE.PMREMGenerator(renderer);
  const environment = pmrem.fromScene(room, .04);
  scene.environment = environment.texture;
  pmrem.dispose();
  room.traverse(node => {
    if (node.geometry) node.geometry.dispose();
    for (const material of [].concat(node.material || [])) material.dispose();
  });
  scene.add(new THREE.HemisphereLight(0xffffff, 0xa4b0c6, .3));
  const key = new THREE.DirectionalLight(0xfff4e8, 1);
  key.position.set(-3, 6, 4); key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  Object.assign(key.shadow.camera, {left:-4,right:4,top:4,bottom:-4,near:.5,far:15});
  key.shadow.camera.updateProjectionMatrix();
  key.shadow.bias = -.00015; key.shadow.normalBias = .012; key.shadow.radius = 4;
  scene.add(key, key.target);
  const fill = new THREE.DirectionalLight(0xe4f0ff, .25); fill.position.set(4, 3, 2); scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffffff, .55); rim.position.set(2, 4, -4); scene.add(rim);
  // Neutral black remains black through output encoding; the transparent
  // receiver can only darken a background, including dark and brand blue.
  const shadow = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({color:0x000000,opacity:.2,toneMapped:false}));
  shadow.rotation.x = -Math.PI / 2; shadow.receiveShadow = true; scene.add(shadow);
  Object.assign(api, {scene,camera,renderer,controls,model:null,mixer:null});
  function render() { if (!document.hidden) { renderer.render(scene, camera); api.frames += 1; } }
  api.render = render;
  function active() { return api.ready && wantsPlaying && (!reducedQuery.matches || explicitMotion) && !document.hidden && inViewport && mode !== 'complete'; }
  function frame(now) {
    raf = null;
    if (!active()) { api.playing = false; return; }
    if (lastTick === null) { lastTick = now; lastPaint = now - 34; }
    if (now - lastPaint >= 1000 / 30 - .1) {
      const delta = Math.min(.1, (now - lastTick) / 1000);
      lastTick = now; lastPaint = now;
      mixer.update(delta * speed);
      render();
    }
    if (active()) raf = requestAnimationFrame(frame);
  }
  function sync() {
    api.playing = active();
    if (api.playing && raf === null) { lastTick = null; lastPaint = null; raf = requestAnimationFrame(frame); }
    if (!api.playing && raf !== null) { cancelAnimationFrame(raf); raf = null; lastTick = null; lastPaint = null; }
    localize();
  }
  function setPlaying(value) {
    wantsPlaying = Boolean(value);
    if (wantsPlaying && reducedQuery.matches) explicitMotion = true;
    sync();
  }
  api.setPlaying = setPlaying;
  function setSpeed(value) {
    if (value !== .5 && value !== 1) return;
    speed = value;
    document.querySelectorAll('[data-speed]').forEach(button => button.setAttribute('aria-pressed', String(Number(button.dataset.speed) === speed)));
  }
  api.setSpeed = setSpeed;
  function setTheme(theme) {

    if (!(theme in colors)) return;
    stage.dataset.theme = theme; scene.background.setHex(colors[theme]);
    shadow.material.opacity = theme === 'dark' ? .35 : .2;
    document.querySelectorAll('[data-theme]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.theme === theme)));
    render();
  }
  api.setTheme = setTheme;
  function resize() {
    const dimension = Math.max(32, Math.min(size, stage.clientWidth - 24, stage.clientHeight - 64));
    viewport.style.width = viewport.style.height = dimension + 'px';
    renderer.setSize(dimension, dimension, false);
    render();
  }
  function setSize(value) {
    if (![72,120,240,480].includes(value)) return;
    size = value; stage.dataset.small = String(size <= 120);
    document.querySelectorAll('[data-size]').forEach(button => button.setAttribute('aria-pressed', String(Number(button.dataset.size) === size)));
    resize();
  }
  api.setSize = setSize;
  function resetLoop(seconds = 0) {
    mode = 'loop'; pendingFinish = false;
    mixer.stopAllAction(); loopAction.reset().setLoop(THREE.LoopRepeat, Infinity).play();
    mixer.setTime(seconds);
    document.getElementById('finish').disabled = false;
    document.getElementById('play').disabled = false;
    localize(); render();
  }
  function seek(seconds) {
    if (!api.ready || !Number.isFinite(seconds)) return null;
    setPlaying(false);
    const normalized = ((seconds % loopAction.getClip().duration) + loopAction.getClip().duration) % loopAction.getClip().duration;
    resetLoop(normalized);
    return normalized;
  }
  api.seek = seek;
  api.replay = () => { if (api.ready) { resetLoop(); setPlaying(true); } };
  api.finish = () => { if (finishAction && mode === 'loop') { pendingFinish = true; document.getElementById('finish').disabled = true; setPlaying(true); } };
  api.snapshot = () => {
    const positions = {};
    if (model) {
      model.updateMatrixWorld(true);
      model.traverse(node => {
        if (/ball|sphere|orb|loading_dot/i.test(node.name)) positions[node.name] = node.getWorldPosition(new THREE.Vector3()).toArray();
      });
    }
    return {ready:api.ready,error:api.error,playing:api.playing,wantsPlaying,reducedMotion:reducedQuery.matches,inViewport,hidden:document.hidden,mode,speed,size,theme:stage.dataset.theme,frames:api.frames,time:loopAction ? loopAction.time : 0,mixerTime:mixer ? mixer.time : 0,stats:api.stats,positions};
  };
  async function load() {
    if (api.loading) return;
    api.loading = true; api.error = null;
    message.hidden = false; document.getElementById('retry').hidden = true; localize();
    try {
      const response = await fetch('/juggling.glb', {cache:'no-store'});
      if (!response.ok) throw new Error(response.status === 404 ? text('missing') : 'GLB: HTTP ' + response.status);
      const buffer = await response.arrayBuffer();
      if (buffer.byteLength < 12 || new DataView(buffer).getUint32(0,true) !== 0x46546c67) throw new Error('Invalid GLB file.');
      const gltf = await new Promise((resolve,reject) => new THREE.GLTFLoader().parse(buffer,'/',resolve,reject));
      model = gltf.scene; mixer = new THREE.AnimationMixer(model);
      const loop = THREE.AnimationClip.findByName(gltf.animations,'JuggleLoop');
      if (!loop || loop.duration <= 0) throw new Error('The GLB must contain a nonempty JuggleLoop animation clip.');
      loopAction = mixer.clipAction(loop); loopAction.play();
      const finish = THREE.AnimationClip.findByName(gltf.animations,'JuggleFinish');
      if (finish) { finishAction = mixer.clipAction(finish); finishAction.setLoop(THREE.LoopOnce,1); finishAction.clampWhenFinished = true; document.getElementById('finish').hidden = false; }
      let meshCount = 0, triangleCount = 0;
      model.traverse(node => {
        if (!node.isMesh) return;
        meshCount += 1;
        triangleCount += (node.geometry.index ? node.geometry.index.count : node.geometry.attributes.position.count) / 3;
        node.castShadow = true; node.receiveShadow = true;
        for (const material of [].concat(node.material)) if ('envMapIntensity' in material) material.envMapIntensity = .45;
      });
      if (!meshCount) throw new Error('No meshes found in GLB.');
      animatedBounds = new THREE.Box3();
      for (let i=0;i<=96;i++) { mixer.setTime(loop.duration * i / 96); model.updateMatrixWorld(true); animatedBounds.expandByObject(model); }
      animatedBounds.expandByVector(new THREE.Vector3(.06,.08,.08));
      const extent = animatedBounds.getSize(new THREE.Vector3());
      if (![extent.x,extent.y,extent.z].every(Number.isFinite)) throw new Error('Invalid animated model bounds.');

      const distance = (Math.max(extent.x,extent.y) / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov)/2)) + extent.z/2) * 1.12;
      controls.target.copy(center); camera.position.copy(center).add(new THREE.Vector3(.1,.035,1).normalize().multiplyScalar(distance)); controls.update();
      key.target.position.copy(center); shadow.position.y = animatedBounds.min.y + .073;
      scene.add(model); Object.assign(api,{model,mixer});
      api.stats = {fileBytes:buffer.byteLength,meshCount,triangleCount,duration:loop.duration,clips:gltf.animations.map(clip => clip.name),bounds:{min:animatedBounds.min.toArray(),max:animatedBounds.max.toArray()}};
      mixer.addEventListener('loop',event => {
        if (event.action === loopAction && pendingFinish && finishAction) { pendingFinish = false; mode = 'finish'; loopAction.stop(); finishAction.reset().play(); }
      });
      mixer.addEventListener('finished',event => {
        if (event.action === finishAction) { mode = 'complete'; setPlaying(false); document.getElementById('play').disabled = true; render(); }
      });
      resetLoop();
      api.ready = true; api.loading = false; message.hidden = true;
      document.getElementById('play').disabled = document.getElementById('replay').disabled = false;
      sync(); render();
    } catch (error) { fail(error); }
  }
  document.getElementById('play').addEventListener('click',() => setPlaying(!wantsPlaying));
  document.getElementById('replay').addEventListener('click',api.replay);
  document.getElementById('finish').addEventListener('click',api.finish);
  document.querySelectorAll('[data-speed]').forEach(button => button.addEventListener('click',() => setSpeed(Number(button.dataset.speed))));
  document.querySelectorAll('[data-size]').forEach(button => button.addEventListener('click',() => setSize(Number(button.dataset.size))));
  document.querySelectorAll('[data-theme]').forEach(button => button.addEventListener('click',() => setTheme(button.dataset.theme)));

  controls.addEventListener('change',render);

  document.addEventListener('visibilitychange',sync);
  reducedQuery.addEventListener('change',() => { if (reducedQuery.matches) { wantsPlaying = false; explicitMotion = false; } sync(); });

    if (event.persisted) return;
    if (raf !== null) cancelAnimationFrame(raf);
    controls.dispose(); environment.dispose(); renderer.dispose();
  },{once:true});
  resize(); load();
})();
</script>
