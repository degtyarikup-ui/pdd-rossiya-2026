<div class="app" id="app">
  <header class="top">
    <button class="brand" id="home" data-tip="Все сцены"><span class="logo"><svg class="i"><use href="#i-map"/></svg></span></button>
    <div class="scene-name"><b id="title">Редактор сцен</b><span id="status" class="chip"></span></div>
    <nav class="seg editor-sections" role="tablist" aria-label="Редактируемая игра">
      <button role="tab" data-editor-section="city" aria-selected="true" class="on">Билеты</button>
      <button role="tab" data-editor-section="regulator" aria-selected="false">Регулировщик</button>
    </nav>
    <div class="spacer"></div>
    <div class="top-actions">
      <button id="undo" class="icon-btn" data-tip="Отменить  ⌘Z" disabled><svg class="i"><use href="#i-undo"/></svg></button>
      <button id="redo" class="icon-btn" data-tip="Вернуть  ⇧⌘Z" disabled><svg class="i"><use href="#i-redo"/></svg></button>
      <span class="sep"></span>
      <button id="play" class="btn ghost" data-tip="Проверить в игре: этот перекрёсток  P"><svg class="i"><use href="#i-play"/></svg><span>Тест в игре</span></button>
      <button id="save" class="btn primary" data-tip="Сохранить  ⌘S" disabled><svg class="i"><use href="#i-save"/></svg><span>Сохранить</span></button>
      <button id="help" class="icon-btn" data-tip="Клавиши  ?"><svg class="i"><use href="#i-keyboard"/></svg></button>
    </div>
  </header>

  <aside class="left">
    <nav class="tabs" id="ltabs">
      <button data-ltab="scenes" class="on" aria-label="Сцены" data-tip="Сцены"><svg class="i"><use href="#i-scenes"/></svg><span>Сцены</span></button>
      <button data-ltab="layers" aria-label="Слои" data-tip="Слои"><svg class="i"><use href="#i-layers"/></svg><span>Слои</span></button>
      <button data-ltab="library" aria-label="Объекты" data-tip="Объекты"><svg class="i"><use href="#i-shapes"/></svg><span>Объекты</span></button>
      <button data-ltab="textures" aria-label="Текстуры" data-tip="Текстуры"><svg class="i"><use href="#i-tiles"/></svg><span>Текстуры</span></button>
    </nav>
    <div class="left-body" id="left-body"></div>
  </aside>

  <main class="stage" id="stage">
    <div id="view" class="view"></div>
    <div id="labels" class="labels"></div>
    <div id="marquee" class="marquee" hidden></div>
    <div id="hint" class="hint" hidden></div>
    <nav id="toolbar" class="toolbar" aria-label="Инструменты"></nav>
    <div id="popover" class="popover" hidden></div>
    <div class="viewbar">
      <div class="seg" role="group" aria-label="Вид">
        <button id="v-plan" data-tip="Сверху  2">2D</button>
        <button id="v-3d" data-tip="Объём  3">3D</button>
      </div>
      <button id="z-out" class="icon-btn" data-tip="Отдалить  −"><svg class="i"><use href="#i-zoomout"/></svg></button>
      <button id="z-fit" class="icon-btn" data-tip="Показать всё  F"><svg class="i"><use href="#i-fit"/></svg></button>
      <button id="z-in" class="icon-btn" data-tip="Приблизить  +"><svg class="i"><use href="#i-zoomin"/></svg></button>
    </div>
    <div id="phone" class="phone" hidden></div>
    <div id="refpic" class="refpic" hidden><div class="refpic-head"><span>Фото билета</span><button class="icon-btn" data-big data-tip="Крупно"><svg class="i"><use href="#i-fit"/></svg></button><button class="icon-btn" data-unpin data-tip="Убрать"><svg class="i"><use href="#i-x"/></svg></button></div><img alt=""></div>
    <div id="drop" class="drop" hidden><div><svg class="i"><use href="#i-upload"/></svg><b>Отпустите PNG</b></div></div>
    <div id="toast" class="toast" role="status"></div>
  </main>

  <aside class="right" id="inspector"></aside>

  <section id="home-screen" class="home" hidden></section>
</div>

<div id="lightbox" class="modal lightbox" hidden></div>

<div id="keys" class="modal" hidden>
  <div class="dialog keys-dialog">
    <div class="dialog-head"><h2>Клавиши</h2><button class="icon-btn" data-close><svg class="i"><use href="#i-x"/></svg></button></div>
    <div id="keys-body" class="keys-grid"></div>
  </div>
</div>

<div id="confirm" class="modal" hidden>
  <div class="dialog confirm-dialog">
    <h2 id="confirm-title"></h2>
    <p id="confirm-text"></p>
    <div class="dialog-foot"><button class="btn ghost" data-answer="no">Отмена</button><button class="btn primary" data-answer="yes" id="confirm-yes">Да</button></div>
  </div>
</div>

<input id="file" type="file" accept="image/png" hidden>
