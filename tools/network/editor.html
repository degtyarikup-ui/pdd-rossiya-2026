<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Редактор сцен</title>
<style>
:root{--bg:#eef0f5;--card:#fff;--tx:#14161c;--sec:#6f768a;--acc:#0574f8;--accs:#0574f81a;--red:#e5412a;--green:#1fa971;--amber:#f0a030;--line:#dfe2ea;--sh:0 2px 10px #0000001a}
@media(prefers-color-scheme:dark){:root{--bg:#0f1013;--card:#1a1b20;--tx:#eef0f6;--sec:#8b92a6;--acc:#4d9bff;--accs:#4d9bff26;--line:#2a2c35;--sh:0 2px 12px #00000066}}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font:14px/1.45 -apple-system,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);display:grid;grid-template-columns:268px 1fr 340px;grid-template-rows:52px 1fr;overflow:hidden}
header{grid-column:1/4;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0;font-weight:650}.chip{padding:2px 9px;border-radius:99px;font-size:12px;background:var(--accs);color:var(--acc);font-weight:600}
.chip.err{background:#e5412a22;color:var(--red)}.chip.ok{background:#1fa97122;color:var(--green)}.sp{flex:1}
button{font:inherit;padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--tx);cursor:pointer}
button:hover{background:var(--bg)}button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}button.pri:hover{filter:brightness(1.08)}button:disabled{opacity:.45;cursor:default}
button.ic{padding:7px 9px}#dirty{color:var(--amber);font-size:12px;font-weight:600}
#left{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#left .top{padding:10px;display:grid;gap:8px}input[type=search]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit}
.seg{display:flex;background:var(--bg);border-radius:9px;padding:3px}.seg button{flex:1;border:0;background:none;padding:5px 4px;font-size:12px;color:var(--sec)}.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px #0002;font-weight:600}
#items{overflow:auto;flex:1}.it{display:flex;gap:10px;align-items:center;padding:7px 12px;cursor:pointer;border-left:3px solid transparent}.it:hover{background:var(--bg)}.it.on{background:var(--accs);border-left-color:var(--acc)}
.it img{width:44px;height:44px;border-radius:7px;object-fit:cover;background:#cfd8c0;flex:none}.it b{font-size:13px}.it small{display:block;color:var(--sec);font-size:11.5px}
.dot{width:9px;height:9px;border-radius:50%;margin-left:auto;flex:none}.dot.e{background:var(--red)}.dot.o{background:var(--green)}.dot.u{background:var(--line)}
#mid{position:relative;min-width:0;min-height:0;background:#cfd8c0}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.float{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:6px}
#layers{left:12px;top:12px;display:flex;flex-direction:column;gap:2px;min-width:170px}#layers label{display:flex;gap:8px;align-items:center;padding:4px 8px;border-radius:7px;cursor:pointer;font-size:13px}#layers label:hover{background:var(--bg)}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}#zoom{right:12px;top:12px;display:flex;flex-direction:column;gap:4px}
#hint{left:50%;bottom:14px;transform:translateX(-50%);font-size:12.5px;color:var(--sec);padding:6px 12px;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#toast{left:50%;top:14px;transform:translateX(-50%);padding:8px 14px;font-weight:600;display:none}
#right{background:var(--card);border-left:1px solid var(--line);overflow:auto;padding:14px 16px 30px}
h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--sec);margin:18px 0 8px;font-weight:700}h3:first-child{margin-top:0}
.card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0}.card.sel{border-color:var(--acc);background:var(--accs)}
.f{display:flex;gap:8px;padding:7px 10px;border-radius:9px;margin:4px 0;cursor:pointer;font-size:13px}.f.error{background:#e5412a18}.f.warn{background:#f0a03022}.f:hover{filter:brightness(.97)}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}.row>label{width:110px;color:var(--sec);font-size:13px;flex:none}.row input,.row select,textarea{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}textarea{width:100%}
.opt{padding:6px 10px;border-radius:8px;background:var(--bg);margin:4px 0}.opt.ok{background:#1fa97122;color:var(--green);font-weight:600}.sec{color:var(--sec);font-size:13px}
.empty{padding:40px 8px;text-align:center;color:var(--sec)}.empty b{display:block;font-size:15px;color:var(--tx);margin-bottom:6px}
kbd{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:12px}
</style></head><body>
<header><h1 id="title">Редактор сцен</h1><span id="chips"></span><span class="sp"></span><span id="dirty"></span>
 <button class="ic" id="undo" title="Отменить (Cmd+Z)">↶ Отменить</button><button class="ic" id="redo" title="Вернуть (Cmd+Shift+Z)">↷</button>
 <button class="pri" id="save" disabled>Сохранить</button></header>
<aside id="left"><div class="top"><input type="search" id="q" placeholder="Поиск: 5_14, ticket…">
 <div class="seg" id="flt"><button data-f="all" class="on">Все</button><button data-f="err">С ошибками</button><button data-f="todo">Не сверены</button></div></div><div id="items"></div></aside>
<section id="mid"><canvas id="cv"></canvas>
 <div class="float" id="layers"></div>
 <div class="float" id="zoom"><button class="ic" id="zin" title="Приблизить">＋</button><button class="ic" id="zout" title="Отдалить">－</button><button class="ic" id="zfit" title="Вся сцена">⤢</button></div>
 <div class="float" id="hint"></div><div class="float" id="toast"></div></section>
<aside id="right"></aside>
<script>
const $=s=>document.querySelector(s);const cv=$('#cv'),cx=cv.getContext('2d');
let S=null,id=null,L=[],flt='all',q='',sel=null,view={x:0,z:0,k:5},hist=[],fut=[],dirty=false,img=null,hover=null,drag=null,pan=null,findings=[];
const LAYERS=[['photo','Реальный вид сцены','#8fb06a',true],['road','Проезжая часть','#2c2f36',false],['manoeuvre','Ваши манёвры','#0574f8',true],['choice','Варианты А / Б / В','#e5412a',true],['approach','Подъезд к вопросу','#1fa971',true],['actor','Участники и их пути','#f0a030',true],['lights','Светофоры и стоп-линия','#a05af0',true],['labels','Подписи','#6f768a',true]];
const on={};LAYERS.forEach(l=>on[l[0]]=l[3]);let photoAlpha=1;
const NAME={left:'налево',right:'направо',straight:'прямо',uturn:'разворот'};
const TYPE={tram:'Трамвай',car:'Автомобиль',pedestrian:'Пешеход',cyclist:'Велосипедист',truck:'Грузовик',bus:'Автобус',van:'Фургон',motorcycle:'Мотоцикл',special:'Спецмашина',cart:'Повозка',train:'Поезд'};
const COLORS={manoeuvre:'#0574f8',choice:'#e5412a',approach:'#1fa971',actor:'#f0a030'};
function routeTitle(r){return r.kind=='manoeuvre'?'Манёвр «'+NAME[r.exit]+'»':r.kind=='choice'?'Траектория '+r.label:r.kind=='approach'?'Подъезд к стоп-линии':'Путь: '+(actorOf(r)?.name||r.id.replace('actor_',''))}
function actorOf(r){return r.kind=='actor'?S.actors.find(a=>a.route==r.id):null}
function routeNote(r){return r.kind=='manoeuvre'?(S.question.maneuver==r.exit?'Правильный по условию — вы поедете так.':'Альтернативный выезд.'):r.kind=='choice'?'Вариант ответа в вопросе.':r.kind=='approach'?'Полоса, по которой вы подъезжаете.':'Движение этого участника.'}
// ---- data
async function api(u,o){return (await fetch(u,o)).json()}
async function loadList(){L=await api('/api/scenes');drawList()}
function drawList(){const t=q.trim().toLowerCase();const a=L.filter(s=>s.id.includes(t)&&(flt=='all'||(flt=='err'&&s.errors)||(flt=='todo'&&s.status=='unverified')));
 $('#items').innerHTML=a.map(s=>`<div class="it ${s.id==id?'on':''}" data-id="${s.id}"><img loading="lazy" src="/preview/${s.id}.png" onerror="this.style.visibility='hidden'"><div><b>${s.id.replace('ticket_','Билет ').replace('_',' · вопрос ')}</b><small>${s.errors?s.errors+' ошибк.':s.status=='ok'?'сверено':s.status=='fixed'?'исправлено':'не сверено'}</small></div><i class="dot ${s.errors?'e':s.status=='ok'||s.status=='fixed'?'o':'u'}"></i></div>`).join('')||'<div class="empty">Ничего не найдено</div>'}
$('#items').onclick=e=>{const d=e.target.closest('.it');if(d)openScene(d.dataset.id)};$('#q').oninput=e=>{q=e.target.value;drawList()};
$('#flt').onclick=e=>{const b=e.target.closest('button');if(!b)return;flt=b.dataset.f;document.querySelectorAll('#flt button').forEach(x=>x.classList.toggle('on',x==b));drawList()};
async function openScene(i){if(dirty&&!confirm('Есть несохранённые правки. Открыть другую сцену без сохранения?'))return;
 const r=await api('/api/scene/'+i);id=i;S=r.scene;findings=r.findings;hist=[];fut=[];dirty=false;sel=null;img=new Image();img.onload=()=>draw();img.onerror=()=>{img=null;draw()};img.src='/preview/'+i+'.png?'+Date.now();
 fit();refresh();drawList()}
function snap(){hist.push(JSON.stringify(S));if(hist.length>100)hist.shift();fut=[]}
function mark(){dirty=true;refresh()}
function refresh(){$('#title').textContent=id?id.replace('ticket_','Билет ').replace('_',' · вопрос '):'Редактор сцен';
 const e=findings.filter(f=>f.level=='error').length,w=findings.filter(f=>f.level=='warn').length;
 $('#chips').innerHTML=S?`<span class="chip ${e?'err':'ok'}">${e?e+' ошибк.':'всё в порядке'}</span>`+(w?` <span class="chip">${w} замеч.</span>`:''):'';
 $('#dirty').textContent=dirty?'● не сохранено':'';$('#save').disabled=!dirty;$('#undo').disabled=!hist.length;$('#redo').disabled=!fut.length;side();hintText();draw()}
// ---- view (screen right = −x, like the game's camera; up = +z)
function size(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=Math.max(300,Math.floor(r.width*d));cv.height=Math.max(300,Math.floor(r.height*d));cv._d=d}
function fit(){size();view={x:0,z:0,k:Math.min(cv.width,cv.height)/(cv._d||1)/92}}
const W=(x,z)=>[cv.width/2+(-(x-view.x))*view.k*cv._d,cv.height/2-(z-view.z)*view.k*cv._d];const U=(px,py)=>[view.x-((px*cv._d-cv.width/2)/(view.k*cv._d)),view.z-((py*cv._d-cv.height/2)/(view.k*cv._d))];
addEventListener('resize',()=>{size();draw()});
function path(pts,close){cx.beginPath();pts.forEach((p,i)=>{const[a,b]=W(p[0],p[1]);i?cx.lineTo(a,b):cx.moveTo(a,b)});if(close)cx.closePath()}
function arrow(a,b,c,d,s){const t=Math.atan2(d-b,c-a);cx.beginPath();cx.moveTo(c,d);cx.lineTo(c-s*Math.cos(t-.4),d-s*Math.sin(t-.4));cx.lineTo(c-s*Math.cos(t+.4),d-s*Math.sin(t+.4));cx.closePath();cx.fill()}
function draw(){cx.clearRect(0,0,cv.width,cv.height);if(!S)return;const d=cv._d;
 if(on.photo&&img&&img.complete&&img.naturalWidth){const[x0,y0]=W(95,95),[x1,y1]=W(-95,-95);cx.globalAlpha=photoAlpha;cx.drawImage(img,x0,y0,x1-x0,y1-y0);cx.globalAlpha=1}
 if(on.road||!(img&&img.naturalWidth&&on.photo)){cx.beginPath();for(const r of S.roads)[r.outer,...(r.holes||[])].forEach(ring=>{ring.forEach((p,i)=>{const[a,b]=W(p[0],p[1]);i?cx.lineTo(a,b):cx.moveTo(a,b)});cx.closePath()});cx.fillStyle=on.photo&&img?.naturalWidth?'#2c2f3699':'#2c2f36';cx.fill('evenodd');cx.strokeStyle='#ffffff55';cx.lineWidth=1.5*d;cx.stroke()}
 if(on.actor)for(const a of S.actors){const r=S.routes.find(x=>x.id==a.route);if(r){cx.setLineDash([6*d,5*d]);cx.strokeStyle='#f0a030';cx.lineWidth=(sel?.route===r?3.5:2)*d;path(r.points);cx.stroke();cx.setLineDash([]);const p=r.points,[a1,b1]=W(...p[p.length-2]),[a2,b2]=W(...p[p.length-1]);cx.fillStyle='#f0a030';arrow(a1,b1,a2,b2,9*d)}
  const[ax,az]=W(a.pos[0],a.pos[2]);const hl=(a.halfLength||2)*view.k*d,hw=(a.halfWidth||1)*view.k*d;cx.save();cx.translate(ax,az);cx.rotate(-(a.yaw||0)+Math.PI);cx.fillStyle=sel?.actor===a?'#f0a030':'#f0a030cc';cx.strokeStyle='#fff';cx.lineWidth=2*d;cx.beginPath();cx.roundRect(-hw,-hl,hw*2,hl*2,4*d);cx.fill();cx.stroke();cx.fillStyle='#fff';cx.beginPath();cx.moveTo(0,-hl-7*d);cx.lineTo(-hw*.7,-hl+2*d);cx.lineTo(hw*.7,-hl+2*d);cx.fill();cx.restore();
  if(on.labels){label(TYPE[a.type]||a.name||a.id,ax,az+hl+13*d,'#f0a030')}}
 for(const r of S.routes){if(r.kind=='actor'||!on[r.kind])continue;const c=COLORS[r.kind],isSel=sel?.route===r,isH=hover?.route===r;cx.strokeStyle=c;cx.lineWidth=(isSel?5:isH?4:3)*d;cx.lineJoin='round';cx.globalAlpha=sel&&!isSel&&sel.route?.5:1;path(r.points);cx.stroke();cx.globalAlpha=1;
  const p=r.points,[a1,b1]=W(...p[p.length-2]),[a2,b2]=W(...p[p.length-1]);cx.fillStyle=c;arrow(a1,b1,a2,b2,11*d);
  if(on.labels){label(r.kind=='choice'?r.label:r.kind=='manoeuvre'?NAME[r.exit]:'подъезд',a2,b2-(14*d),c)}}
 if(on.lights){const[sx,sz]=W(S.stop.x,S.stop.z);cx.fillStyle='#fff';cx.fillRect(sx-24*d,sz-3*d,48*d,6*d);cx.strokeStyle='#e5412a';cx.lineWidth=2*d;cx.strokeRect(sx-24*d,sz-3*d,48*d,6*d);if(on.labels)label('стоп / ваш старт',sx,sz+16*d,'#e5412a');
  for(const l of S.lights){const[a,b]=W(...l.pos);cx.fillStyle='#222';cx.fillRect(a-6*d,b-14*d,12*d,28*d);['#e5412a','#f0a030','#1fa971'].forEach((c,i)=>{cx.fillStyle=c;cx.beginPath();cx.arc(a,b-8*d+i*8*d,3.2*d,0,7);cx.fill()});if(on.labels)label('светофор',a,b+26*d,'#a05af0')}}
 const pts=sel?.route?.points||sel?.ring;if(pts)pts.forEach((p,i)=>{const[a,b]=W(p[0],p[1]);cx.fillStyle=(sel.i==i)?'#fff':'#0574f8';cx.strokeStyle=(sel.i==i)?'#0574f8':'#fff';cx.lineWidth=2.5*d;cx.beginPath();cx.arc(a,b,(sel.i==i?8:6)*d,0,7);cx.fill();cx.stroke()})}
function label(t,x,y,c){const d=cv._d;cx.font=`600 ${12*d}px -apple-system,system-ui,sans-serif`;const w=cx.measureText(t).width+12*d;cx.fillStyle='#000000b3';cx.beginPath();cx.roundRect(x-w/2,y-9*d,w,18*d,9*d);cx.fill();cx.fillStyle='#fff';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(t,x,y);cx.textAlign='start'}
// ---- picking
function allLines(){const o=[];S.routes.forEach(r=>{if(r.kind=='actor'||on[r.kind])if(r.kind!='actor'||on.actor)o.push({kind:'route',route:r,pts:r.points})});if(on.road)S.roads.forEach(r=>{o.push({kind:'ring',ring:r.outer,pts:r.outer,road:r});(r.holes||[]).forEach(h=>o.push({kind:'ring',ring:h,pts:h,road:r}))});return o}
function pickPoint(px,py){const d=cv._d;let best=null,bd=12;const cand=sel?[sel.route?{kind:'route',route:sel.route,pts:sel.route.points}:{kind:'ring',ring:sel.ring,pts:sel.ring},...allLines()]:allLines();for(const it of cand)it.pts.forEach((p,i)=>{const[a,b]=W(p[0],p[1]);const dd=Math.hypot(a/d-px,b/d-py);if(dd<bd){bd=dd;best={...it,i}}});return best}
function pickLine(px,py){const d=cv._d;let best=null,bd=9;for(const it of allLines()){const n=it.pts.length-(it.kind=='ring'?0:1);for(let i=0;i<n;i++){const A=W(...it.pts[i]),B=W(...it.pts[(i+1)%it.pts.length]);const ax=A[0]/d,ay=A[1]/d,bx=B[0]/d,by=B[1]/d;const l2=(bx-ax)**2+(by-ay)**2||1;const t=Math.max(0,Math.min(1,((px-ax)*(bx-ax)+(py-ay)*(by-ay))/l2));const dd=Math.hypot(px-(ax+t*(bx-ax)),py-(ay+t*(by-ay)));if(dd<bd){bd=dd;best={...it,i,at:U(px,py)}}}}return best}
function pickActor(px,py){const[x,z]=U(px,py);return S.actors.find(a=>Math.hypot(a.pos[0]-x,a.pos[2]-z)<Math.max(a.halfLength||2,2))}
function relPos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cv.onmousedown=e=>{if(!S)return;const[px,py]=relPos(e);if(e.button==1||e.button==2||e.shiftKey||e.altKey&&false){pan={x:px,y:py,vx:view.x,vz:view.z};return}
 const p=pickPoint(px,py);if(p){sel=p;snap();drag=p;refresh();return}
 const a=on.actor&&pickActor(px,py);if(a){sel={actor:a};refresh();return}
 const l=pickLine(px,py);sel=l?{...l,i:-1}:null;if(!l)pan={x:px,y:py,vx:view.x,vz:view.z};refresh()};
cv.ondblclick=e=>{if(!S)return;const[px,py]=relPos(e);const l=pickLine(px,py);if(l){snap();const at=l.at.map(v=>Math.round(v*20)/20);l.pts.splice(l.i+1,0,at);sel={...l,i:l.i+1};mark()}};
cv.oncontextmenu=e=>{e.preventDefault();if(!S)return;const[px,py]=relPos(e);const p=pickPoint(px,py);if(p&&p.pts.length>(p.kind=='ring'?3:2)){snap();p.pts.splice(p.i,1);sel=null;mark()}};
addEventListener('mousemove',e=>{if(!S)return;const[px,py]=relPos(e);if(pan){view.x=pan.vx+(px-pan.x)/view.k;view.z=pan.vz+(py-pan.y)/view.k;draw();return}
 if(drag){const[x,z]=U(px,py);const r=v=>e.metaKey?v:Math.round(v*20)/20;drag.pts[drag.i][0]=r(x);drag.pts[drag.i][1]=r(z);if(!dirty)dirty=true;$('#dirty').textContent='● не сохранено';$('#save').disabled=false;draw();return}
 if(e.target==cv){const l=pickLine(px,py);const h=l&&l.route?{route:l.route}:null;if((h?.route)!==(hover?.route)){hover=h;cv.style.cursor=h||pickPoint(px,py)?'pointer':'default';draw()}}});
addEventListener('mouseup',()=>{if(drag){drag=null;refresh()}pan=null});
cv.onwheel=e=>{e.preventDefault();const[px,py]=relPos(e);const[x,z]=U(px,py);view.k*=e.deltaY<0?1.12:1/1.12;const[x2,z2]=U(px,py);view.x+=x-x2;view.z+=z-z2;draw()};
$('#zin').onclick=()=>{view.k*=1.3;draw()};$('#zout').onclick=()=>{view.k/=1.3;draw()};$('#zfit').onclick=()=>{fit();draw()};
addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;const m=e.metaKey||e.ctrlKey;
 if(m&&e.key.toLowerCase()=='z'){e.preventDefault();e.shiftKey?redo():undo()}else if(m&&e.key=='s'){e.preventDefault();save()}
 else if((e.key=='Delete'||e.key=='Backspace')&&sel&&sel.i>=0&&sel.pts?.length>(sel.kind=='ring'?3:2)){snap();sel.pts.splice(sel.i,1);sel=null;mark()}
 else if(e.key=='Escape'){sel=null;refresh()}else if(sel&&sel.i>=0&&e.key.startsWith('Arrow')){e.preventDefault();snap();const s=e.shiftKey?.5:.05,p=sel.pts[sel.i];if(e.key=='ArrowUp')p[1]+=s;if(e.key=='ArrowDown')p[1]-=s;if(e.key=='ArrowLeft')p[0]+=s;if(e.key=='ArrowRight')p[0]-=s;mark()}});
function undo(){if(hist.length){fut.push(JSON.stringify(S));S=JSON.parse(hist.pop());sel=null;mark()}}function redo(){if(fut.length){hist.push(JSON.stringify(S));S=JSON.parse(fut.pop());sel=null;mark()}}
$('#undo').onclick=undo;$('#redo').onclick=redo;
let tt;function toast(t,c){const el=$('#toast');el.textContent=t;el.style.color=c||'var(--tx)';el.style.display='block';clearTimeout(tt);tt=setTimeout(()=>el.style.display='none',2600)}
async function save(){if(!S||!dirty)return;const r=await api('/api/scene/'+id,{method:'POST',body:JSON.stringify(S)});findings=r.findings;dirty=false;refresh();loadList();const e=findings.filter(f=>f.level=='error').length;toast(e?`Сохранено. Осталось ошибок: ${e}`:'Сохранено, дорога пересобрана ✓',e?'var(--red)':'var(--green)')}
$('#save').onclick=save;addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
// ---- side panel
function field(l,v,k,t,get){return `<div class="row"><label>${l}</label><input data-k="${k}" type="${t||'text'}" value="${v??''}"></div>`}
function side(){const R=$('#right');if(!S){R.innerHTML='<div class="empty"><b>Выберите сцену слева</b>Откроется вид сверху с настоящими текстурами, участниками и всеми линиями, которые можно править.</div>';return}
 let h='';
 if(sel?.route){const r=sel.route,a=actorOf(r);h+=`<h3>Выбрано</h3><div class="card sel"><b>${routeTitle(r)}</b><div class="sec">${routeNote(r)}</div><div class="sec">Точек: ${r.points.length}${sel.i>=0?` · выбрана №${sel.i+1}`:''}</div>
  ${sel.i>=0?`<div class="row"><label>Точка X</label><input id="px" type="number" step="0.05" value="${r.points[sel.i][0]}"></div><div class="row"><label>Точка Z</label><input id="pz" type="number" step="0.05" value="${r.points[sel.i][1]}"></div>`:''}
  <div class="row"><button id="addp">+ Точка в конец</button>${sel.i>=0?'<button id="delp">Удалить точку</button>':''}</div></div>`;
  if(a)h+=actorCard(a)}
 else if(sel?.actor)h+=`<h3>Выбрано</h3>`+actorCard(sel.actor);
 else if(sel?.ring)h+=`<h3>Выбрано</h3><div class="card sel"><b>Контур дороги</b><div class="sec">Точек: ${sel.pts.length}. Дорога — внутри контура, острова — внутренние контуры.</div></div>`;
 else h+=`<h3>Как править</h3><div class="card sec">Нажмите на цветную линию — она выделится, на её точки — можно потянуть. <b>Двойной клик</b> по линии добавляет точку, <b>правый клик</b> по точке удаляет. <kbd>←↑↓→</kbd> двигают точку на 5 см, <kbd>Shift</kbd> с ними на 50 см. <kbd>⌘Z</kbd> отмена, <kbd>⌘S</kbd> сохранить. Колесо — масштаб, перетаскивание пустого места — сдвиг вида.</div>`;
 h+=`<h3>Проверка сцены</h3>`+(findings.length?findings.map((f,i)=>`<div class="f ${f.level}" data-i="${i}">${f.level=='error'?'✗':'!'}<span>${f.message}</span></div>`).join(''):'<div class="f" style="background:#1fa97122;color:var(--green)">✓ Ошибок нет: старт и пути на дороге.</div>');
 const t=S.question.text.ru||{};h+=`<h3>Вопрос билета</h3><div class="sec">${t.ticket||''}</div><div style="margin:4px 0 6px"><b>${t.title||''}</b></div>`+(t.options||[]).map((o,i)=>`<div class="opt ${i==S.question.correct?'ok':''}">${i+1}. ${o}${i==S.question.correct?'  ✓':''}</div>`).join('')+
 `<div class="sec" style="margin-top:6px">Манёвр по условию: <b>${NAME[S.question.maneuver]||'—'}</b>${(S.question.yieldTo||[]).length?` · уступить: <b>${S.question.yieldTo.join(', ')}</b>`:''}</div>`+
 `<h3>Сверка с билетом</h3><div class="row"><select id="st"><option value="unverified">Не сверено</option><option value="ok">Соответствует билету</option><option value="fixed">Исправлено вручную</option></select></div><textarea id="nt" rows="3" placeholder="Заметки: что не так, что поправил">${S.compliance.notes||''}</textarea>`;
 h+=`<h3>Вид</h3><div class="row"><label>Прозрачность фото</label><input id="pa" type="range" min="0.2" max="1" step="0.05" value="${photoAlpha}"></div>`;
 R.innerHTML=h;
 $('#st').value=S.compliance.status||'unverified';$('#st').onchange=e=>{S.compliance.status=e.target.value;mark()};$('#nt').oninput=e=>{S.compliance.notes=e.target.value;dirty=true;$('#dirty').textContent='● не сохранено';$('#save').disabled=false};$('#pa').oninput=e=>{photoAlpha=+e.target.value;draw()};
 R.querySelectorAll('.f[data-i]').forEach(el=>el.onclick=()=>{const m=findings[+el.dataset.i].message.match(/^([a-z0-9_]+):/);if(m){const r=S.routes.find(x=>x.id==m[1]);if(r){sel={route:r,pts:r.points,i:-1};const c=r.points[Math.floor(r.points.length/2)];view.x=c[0];view.z=c[1];refresh()}}});
 const px=$('#px'),pz=$('#pz');if(px){px.onchange=()=>{snap();sel.route.points[sel.i][0]=+px.value;mark()};pz.onchange=()=>{snap();sel.route.points[sel.i][1]=+pz.value;mark()}}
 if($('#addp'))$('#addp').onclick=()=>{snap();const p=sel.route.points,l=p[p.length-1],q=p[p.length-2]||l;p.push([+(l[0]+(l[0]-q[0])*.5).toFixed(2),+(l[1]+(l[1]-q[1])*.5).toFixed(2)]);sel.i=p.length-1;mark()};
 if($('#delp'))$('#delp').onclick=()=>{if(sel.route.points.length>2){snap();sel.route.points.splice(sel.i,1);sel=null;mark()}};
 R.querySelectorAll('[data-a]').forEach(el=>el.onchange=()=>{const a=sel.actor||actorOf(sel.route);snap();const k=el.dataset.a;a[k]=el.type=='number'?+el.value:el.value;mark()})}
function actorCard(a){return `<div class="card"><b>${TYPE[a.type]||a.type||'Участник'}</b> <span class="sec">${a.name||''}</span>
 <div class="row"><label>Скорость, м/с</label><input data-a="maxSpeed" type="number" step="0.5" value="${a.maxSpeed??''}"></div>
 <div class="row"><label>Длина, м</label><input data-a="halfLength" type="number" step="0.1" value="${a.halfLength??''}"></div>
 <div class="sec">Стоит на (${a.pos[0].toFixed(1)}; ${a.pos[2].toFixed(1)}) м${a.behaviour?.stopFor?` · ждёт ${a.behaviour.stopFor} с`:''}${(a.behaviour?.holdFor||[]).length?` · пропускает: ${a.behaviour.holdFor.join(', ')}`:''}</div></div>`}
function hintText(){$('#hint').textContent=!S?'':sel?.route?(sel.i>=0?'Тяните точку · ←↑↓→ точнее · Del или правый клик — удалить':'Тяните синие точки · двойной клик по линии — добавить точку'):'Нажмите на линию или участника, чтобы править'}
// layers panel
$('#layers').innerHTML=LAYERS.map(l=>`<label><input type="checkbox" data-l="${l[0]}" ${l[3]?'checked':''}><span class="sw" style="background:${l[2]}"></span>${l[1]}</label>`).join('');
$('#layers').insertAdjacentHTML('afterbegin','<div id="lt" style="display:flex;justify-content:space-between;align-items:center;padding:2px 8px 6px;font-weight:650;font-size:12.5px;cursor:pointer">Слои <span id="lc">−</span></div>');
$('#lt').onclick=()=>{const c=$('#layers'),m=c.classList.toggle('min');document.querySelectorAll('#layers label').forEach(l=>l.style.display=m?'none':'flex');$('#lc').textContent=m?'+':'−'};
$('#layers').onchange=e=>{on[e.target.dataset.l]=e.target.checked;draw()};
size();refresh();loadList();
</script></body></html>
